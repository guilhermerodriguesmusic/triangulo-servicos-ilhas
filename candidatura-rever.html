<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rever candidatura — TRIÂNGULO</title>
<link rel="icon" href="logo.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f9fc;color:#153458;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:.04em;margin-bottom:18px}.brand img{width:40px}.card{background:#fff;border:1px solid #dce9ef;border-radius:22px;padding:24px}.state{font-size:12px;font-weight:950;color:#0a8068;text-transform:uppercase;letter-spacing:.08em}.card h1{font-size:28px;margin:8px 0 18px}.details{background:#f7fafc;border-radius:15px;padding:15px}.row{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #e5eef2;font-size:13px}.row:last-child{border:0}.row b{color:#668095}.desc{white-space:pre-wrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:14px;font-weight:900;font-size:14px;cursor:pointer}.yes{background:#108b6e;color:#fff}.no{background:#eef3f6;color:#37566d}.btn:disabled{opacity:.5}.rejectbox{display:none;margin-top:12px}.rejectbox.show{display:block}.rejectbox textarea{width:100%;min-height:90px;border:1px solid #d5e3ea;border-radius:12px;padding:11px;font:inherit}.message{text-align:center;padding:25px 5px}.message h2{margin:8px 0}.message p{color:#657e91}.loading{text-align:center;color:#718799;padding:40px 0}.footer{text-align:center;font-size:11px;color:#7c91a2;padding:18px}@media(max-width:520px){.row{grid-template-columns:95px 1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><img src="logo.svg" alt="">TRIÂNGULO</div>
<section class="card">
<div id="loading" class="loading">A carregar candidatura…</div>
<div id="review" hidden>
  <div class="state">Candidatura de prestador</div>
  <h1 id="title">Rever candidatura</h1>
  <div class="details">
    <div class="row"><b>Nome</b><span id="name"></span></div>
    <div class="row"><b>Negócio</b><span id="business"></span></div>
    <div class="row"><b>Ilha base</b><span id="base"></span></div>
    <div class="row"><b>Trabalha em</b><span id="islands"></span></div>
    <div class="row"><b>Categorias</b><span id="categories"></span></div>
    <div class="row" id="otherRow" hidden><b>Outro serviço</b><span id="otherService"></span></div>
    <div class="row"><b>Preço</b><span id="price"></span></div>
    <div class="row"><b>Disponibilidade</b><span id="availability"></span></div>
    <div class="row"><b>Fundador</b><span id="founder"></span></div>
    <div class="row"><b>Recomendado por</b><span id="referred"></span></div>
    <div class="row"><b>Descrição</b><span id="description" class="desc"></span></div>
  </div>
  <div id="rejectbox" class="rejectbox">
    <textarea id="note" maxlength="500" placeholder="Motivo da recusa (opcional)"></textarea>
  </div>
  <div class="actions">
    <button id="approve" class="btn yes">Aprovar</button>
    <button id="reject" class="btn no">Recusar</button>
  </div>
</div>
<div id="message" class="message" hidden></div>
</section>
<div class="footer">TRIÂNGULO · Pico · Faial · São Jorge</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s);
const db=window.supabase.createClient('https://cozamrvrhmwgxbuubjub.supabase.co','sb_publishable_4WXv0AQJ_HceVNnFKcZFHA_TuZPTHd9');
const qs=new URLSearchParams(location.search),token=qs.get('token'),mode=qs.get('mode');
function showMessage(title,text){$('#loading').hidden=true;$('#review').hidden=true;$('#message').hidden=false;$('#message').innerHTML='<div style="font-size:40px">✓</div><h2>'+title+'</h2><p>'+text+'</p>'}
function fmtPrice(d){if(d.pricing_type==='quote'||d.price==null)return 'Sob orçamento';return d.price+' € · '+d.pricing_type}
async function load(){
  if(!token){showMessage('Link inválido','Esta ligação não é válida.');return}
  const {data,error}=await db.rpc('provider_review_context',{p_token:token});
  if(error||!data||!data.ok){showMessage('Link inválido','Esta ligação não é válida.');return}
  if(data.state!=='pending'){
    const map={approved:['Já aprovada','Esta candidatura já foi aprovada.'],rejected:['Já recusada','Esta candidatura já foi recusada.'],expired:['Link expirado','Este link de revisão expirou.']};
    const m=map[data.state]||['Candidatura processada','Esta candidatura já não está pendente.'];showMessage(m[0],m[1]);return
  }
  $('#loading').hidden=true;$('#review').hidden=false;
  $('#name').textContent=data.name||'—';$('#business').textContent=data.business_name||'—';$('#base').textContent=data.base_island||'—';
  $('#islands').textContent=(data.service_islands||[]).join(', ')||'—';$('#categories').textContent=(data.categories||[]).join(', ')||'—';if(data.other_service){$('#otherRow').hidden=false;$('#otherService').textContent=data.other_service}
  $('#price').textContent=fmtPrice(data);$('#availability').textContent=data.availability||'—';$('#founder').textContent=data.founder_program?'Sim':'Não';
  $('#referred').textContent=data.referred_by||'—';$('#description').textContent=data.description||'—';
  if(mode==='approve'){$('#title').textContent='Confirmar aprovação';$('#reject').style.display='none'}
  if(mode==='reject'){$('#title').textContent='Confirmar recusa';$('#approve').style.display='none';$('#rejectbox').classList.add('show')}
}
async function act(action){
  if(action==='reject'&&!$('#rejectbox').classList.contains('show')){$('#rejectbox').classList.add('show');$('#approve').style.display='none';$('#title').textContent='Confirmar recusa';return}
  $('#approve').disabled=true;$('#reject').disabled=true;
  const {data,error}=await db.rpc('respond_to_provider_application',{p_token:token,p_action:action,p_note:$('#note').value.trim()||null});
  if(error||!data||!data.ok){showMessage('Não foi possível','Tenta novamente.');return}
  if(data.state==='approved')showMessage('Candidatura aprovada','O prestador já ficou ativo no TRIÂNGULO.');
  else if(data.state==='rejected')showMessage('Candidatura recusada','A candidatura ficou marcada como recusada.');
  else if(data.state==='expired')showMessage('Link expirado','Este link de revisão expirou.');
  else showMessage('Candidatura processada','Esta candidatura já tinha sido processada.');
}
$('#approve').onclick=()=>act('approve');$('#reject').onclick=()=>act('reject');load();
</script>
</body></html>
