<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3158">
<title>TRIÂNGULO Açores</title>
<meta name="description" content="TRIÂNGULO Açores — uma plataforma local que liga prestadores de serviços a clientes no Pico, Faial e São Jorge.">
<link rel="canonical" href="https://trianguloacores.pt/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TRIÂNGULO Açores">
<meta property="og:title" content="TRIÂNGULO Açores">
<meta property="og:description" content="Serviços locais no Pico, Faial e São Jorge. Encontra. Reserva. Resolve.">
<meta property="og:url" content="https://trianguloacores.pt/">
<meta property="og:image" content="https://trianguloacores.pt/assets/pico-hero-real.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/logo.svg">
<style>
:root{--navy:#0f3158;--green:#79e5c4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f3158;color:#fff}
body{min-height:100svh}
.welcome{position:relative;min-height:100svh;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:#0f3158;padding:calc(env(safe-area-inset-top) + 82px) 18px calc(env(safe-area-inset-bottom) + 36px)}
.welcome:before{content:"";position:absolute;inset:0;z-index:-3;background:url('/assets/pico-hero-real.jpg') center 45%/cover no-repeat;transform:scale(1.02)}
.welcome:after{content:"";position:absolute;inset:0;z-index:-2;background:
 linear-gradient(180deg,rgba(5,27,47,.22) 0%,rgba(6,34,57,.20) 38%,rgba(6,31,53,.60) 68%,rgba(5,26,45,.96) 100%),
 radial-gradient(circle at 72% 12%,rgba(121,229,196,.17),transparent 30%)}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 18px 0}
.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:.08em;font-size:15px}
.brand img{width:45px;height:48px;object-fit:contain;background:rgba(255,255,255,.92);border-radius:14px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.lang{display:flex;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.20);background:rgba(4,31,53,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang button{border:0;background:transparent;color:rgba(255,255,255,.70);font-size:11px;font-weight:900;padding:7px 10px;border-radius:999px}
.lang button.active{background:#fff;color:var(--navy)}
.content{width:min(100%,760px);padding:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.kicker{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.16em;color:#9aedd4;margin-bottom:10px}
h1{font-size:clamp(44px,11vw,72px);line-height:.94;letter-spacing:-.05em;margin:0;text-shadow:0 3px 24px rgba(0,0,0,.28)}
p{font-size:14px;line-height:1.5;color:rgba(255,255,255,.82);margin:15px auto 0;max-width:590px}
.cta{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(100%,520px);padding:17px 18px 17px 20px;background:#fff;color:var(--navy);border-radius:20px;text-decoration:none;box-shadow:0 18px 42px rgba(0,0,0,.24)}
.cta-copy{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}.cta-copy small,.cta-copy b{display:block;margin:0;padding:0}.cta-copy small{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#688096}.cta-copy b{font-size:17px}
.arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#def7ef;color:#087459;font-size:24px}
.client{display:inline-block;margin-top:14px;color:rgba(255,255,255,.76);font-size:10px;text-decoration:none}
@media(min-width:760px){
 .top{padding-left:34px;padding-right:34px}
}
@media(max-height:700px){
 h1{font-size:42px}.content p{margin-top:10px}.cta{margin-top:16px}
}
</style>
</head>
<body>
<main class="welcome">
  <header class="top">
    <div class="brand"><img src="/logo.svg" alt="">TRIÂNGULO AÇORES</div>
    <div class="lang" aria-label="Idioma"><button id="pt" class="active" type="button">PT</button><button id="en" type="button">EN</button></div>
  </header>


  <section class="content">
    <div class="kicker" data-pt="Pico · Faial · São Jorge" data-en="Pico · Faial · São Jorge">Pico · Faial · São Jorge</div>
    <h1 data-pt="Bem-vindo ao TRIÂNGULO Açores." data-en="Welcome to TRIÂNGULO Açores.">Bem-vindo ao TRIÂNGULO Açores.</h1>
    <p data-pt="A plataforma local que aproxima quem presta serviços de quem precisa deles nas ilhas." data-en="The local platform connecting service providers with people who need them across the islands.">A plataforma local que aproxima quem presta serviços de quem precisa deles nas ilhas.</p>

    <a class="cta" href="/prestadores.html">
      <span class="cta-copy">
        <small data-pt="Descobre a plataforma" data-en="Discover the platform">Descobre a plataforma</small>
        <b data-pt="Entrar no TRIÂNGULO →" data-en="Enter TRIÂNGULO →">Entrar no TRIÂNGULO →</b>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <a class="client" href="/app.html" data-pt="Procuras um serviço? Abrir app para clientes →" data-en="Looking for a service? Open the client app →">Procuras um serviço? Abrir app para clientes →</a>
  </section>
</main>
<script>
let lang=localStorage.getItem('tri_lang')||'pt';
function setLang(v){lang=v;localStorage.setItem('tri_lang',v);document.documentElement.lang=v;document.querySelectorAll('[data-pt][data-en]').forEach(el=>el.textContent=v==='pt'?el.dataset.pt:el.dataset.en);document.querySelector('#pt').classList.toggle('active',v==='pt');document.querySelector('#en').classList.toggle('active',v==='en');document.title=v==='pt'?'TRIÂNGULO Açores':'TRIÂNGULO Azores';const m=document.querySelector('meta[name="description"]');if(m)m.content=v==='pt'?'TRIÂNGULO Açores — uma plataforma local que liga prestadores de serviços a clientes no Pico, Faial e São Jorge.':'TRIÂNGULO Azores — a local platform connecting service providers and customers across Pico, Faial and São Jorge.'}
document.querySelector('#pt').onclick=()=>setLang('pt');document.querySelector('#en').onclick=()=>setLang('en');setLang(lang);
</script>
</body>
</html>
