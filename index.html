<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3158">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRIÂNGULO">
<title>TRIÂNGULO — Serviços locais nas ilhas</title>
<meta name="description" content="Encontra profissionais e serviços locais no Pico, Faial e São Jorge.">
<link rel="icon" href="/logo.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<style>
:root{--navy:#0f3158;--green:#69e0bc;--white:#fff;--glass:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f3158;color:#fff}
body{min-height:100svh;overflow-x:hidden}
.entry{position:relative;min-height:100svh;display:flex;flex-direction:column;isolation:isolate;overflow:hidden;background:#0f3158}
.entry:before{content:"";position:absolute;inset:0;z-index:-3;background:url('/assets/pico-hero-real.jpg') center 44%/cover no-repeat;transform:scale(1.02)}
.entry:after{content:"";position:absolute;inset:0;z-index:-2;background:
 linear-gradient(180deg,rgba(5,29,50,.28) 0%,rgba(6,37,63,.18) 28%,rgba(8,42,70,.35) 54%,rgba(7,30,52,.88) 82%,rgba(6,25,44,.97) 100%),
 radial-gradient(circle at 72% 14%,rgba(112,224,188,.18),transparent 29%)}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 20px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand-logo{width:48px;height:52px;padding:6px;border-radius:16px;background:rgba(255,255,255,.91);box-shadow:0 10px 32px rgba(0,0,0,.18);object-fit:contain}
.brand-word{font-size:16px;font-weight:950;letter-spacing:.10em;text-shadow:0 2px 14px rgba(0,0,0,.26)}
.lang{display:flex;padding:3px;border:1px solid rgba(255,255,255,.22);background:rgba(6,37,63,.30);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px}
.lang button{border:0;background:transparent;color:rgba(255,255,255,.70);font-weight:900;font-size:11px;padding:7px 10px;border-radius:999px}
.lang button.active{background:#fff;color:var(--navy)}
.hero-spacer{flex:1;min-height:30vh}
.content{padding:0 18px calc(env(safe-area-inset-bottom) + 22px)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#b5f4df}
.eyebrow:before{content:"";width:22px;height:2px;border-radius:999px;background:var(--green)}
h1{font-size:clamp(43px,12vw,74px);line-height:.93;letter-spacing:-.052em;margin:0;max-width:680px;text-wrap:balance;text-shadow:0 3px 24px rgba(0,0,0,.28)}
.lead{font-size:14px;line-height:1.5;color:rgba(255,255,255,.80);max-width:520px;margin:16px 0 0}
.islands{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}
.islands span{font-size:10px;font-weight:850;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.enter{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-decoration:none;color:var(--navy);background:#fff;border-radius:22px;padding:17px 18px 17px 20px;box-shadow:0 18px 42px rgba(0,0,0,.24);transition:transform .16s ease,box-shadow .16s ease}
.enter:active{transform:scale(.985)}
.enter-copy{display:grid;gap:2px}
.enter-copy small{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#4e6a82}
.enter-copy b{font-size:17px;letter-spacing:-.015em}
.enter-arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#dff8ef;color:#08765c;font-size:25px;font-weight:600}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.trust div{min-height:48px;border-radius:14px;padding:8px 7px;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.78);font-size:9px;font-weight:800;line-height:1.2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media(min-width:760px){
 .top{padding-left:36px;padding-right:36px}
 .content{padding-left:38px;padding-right:38px;max-width:760px}
 .hero-spacer{min-height:27vh}
 .enter{max-width:560px}
 .trust{max-width:560px}
}
@media(max-height:720px){
 .hero-spacer{min-height:15vh}
 h1{font-size:42px}
 .lead{margin-top:10px}
 .islands{margin:12px 0}
 .trust{display:none}
}
</style>
</head>
<body>
<main class="entry">
  <header class="top">
    <a class="brand" href="/" aria-label="TRIÂNGULO">
      <img class="brand-logo" src="/logo.svg" alt="">
      <span class="brand-word">TRIÂNGULO</span>
    </a>
    <div class="lang" aria-label="Idioma">
      <button id="pt" class="active" type="button">PT</button>
      <button id="en" type="button">EN</button>
    </div>
  </header>

  <div class="hero-spacer"></div>

  <section class="content">
    <div class="eyebrow" data-pt="Serviços locais nas ilhas" data-en="Local services across the islands">Serviços locais nas ilhas</div>
    <h1 data-pt="A tua ilha. O serviço certo." data-en="Your island. The right service.">A tua ilha.<br>O serviço certo.</h1>
    <p class="lead" data-pt="Encontra pessoas locais para resolver o que precisas — de forma simples, próxima e direta." data-en="Find local people to help with what you need — simply, locally and directly.">Encontra pessoas locais para resolver o que precisas — de forma simples, próxima e direta.</p>

    <div class="islands" aria-label="Ilhas disponíveis">
      <span>Pico</span><span>Faial</span><span>São Jorge</span>
    </div>

    <a class="enter" href="/inicio.html">
      <span class="enter-copy">
        <small data-pt="Começar agora" data-en="Start now">Começar agora</small>
        <b data-pt="Entrar no TRIÂNGULO" data-en="Enter TRIÂNGULO">Entrar no TRIÂNGULO</b>
      </span>
      <span class="enter-arrow" aria-hidden="true">→</span>
    </a>

    <div class="trust" aria-hidden="true">
      <div data-pt="Profissionais locais" data-en="Local professionals">Profissionais locais</div>
      <div data-pt="Perfis revistos" data-en="Reviewed profiles">Perfis revistos</div>
      <div data-pt="Três ilhas, uma rede" data-en="Three islands, one network">Três ilhas, uma rede</div>
    </div>
  </section>
</main>
<script>
let lang=localStorage.getItem('tri_lang')||'pt';
function setLang(v){
  lang=v;
  localStorage.setItem('tri_lang',v);
  document.documentElement.lang=v;
  document.querySelectorAll('[data-pt][data-en]').forEach(el=>{
    const value=v==='pt'?el.dataset.pt:el.dataset.en;
    if(el.tagName==='H1')el.innerHTML=value.replace('. ','.<br>');
    else el.textContent=value;
  });
  document.querySelector('#pt').classList.toggle('active',v==='pt');
  document.querySelector('#en').classList.toggle('active',v==='en');
}
document.querySelector('#pt').onclick=()=>setLang('pt');
document.querySelector('#en').onclick=()=>setLang('en');
setLang(lang);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}
</script>
</body>
</html>
