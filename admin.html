<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>TRIÂNGULO Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef7fc;font-family:Inter,system-ui,-apple-system,sans-serif;color:#153458}main{max-width:1050px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.top-actions{display:flex;gap:8px;align-items:center}.lang{display:flex;background:#fff;border:1px solid #dde7ef;border-radius:999px;padding:3px}.lang button{border:0;background:transparent;padding:6px 9px;border-radius:999px;font-weight:900;color:#6b8095;cursor:pointer}.lang button.active{background:#e8f4ff;color:#1269b0}.top img{width:190px;height:auto;vertical-align:middle}.card{background:#fff;border:1px solid #dde7ef;border-radius:16px;padding:15px;margin-bottom:12px}.login{max-width:420px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;border-radius:14px;padding:14px;text-align:center}.stat b{font-size:25px;display:block}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid #dde7ef;border-radius:15px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#6b8095;font-size:12px}.tag{background:#eef6fb;border-radius:999px;padding:4px 7px;font-size:10px}.btn{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.ok{background:#14aa7d;color:#fff}.no{background:#ffe6e8;color:#9b2230}.blue{background:#e8f4ff;color:#1269b0}.wa{background:#e4f8ee;color:#087a55}input{width:100%;padding:11px;border:1px solid #d8e3eb;border-radius:10px;margin:5px 0 10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="top"><div style="display:flex;align-items:center;gap:12px"><a href="/"><img src="/logo-v2.svg" alt="TRIÂNGULO Açores"></a><strong>ADMIN</strong></div><div class="top-actions"><div class="lang"><button id="pt" class="active" type="button">PT</button><button id="en" type="button">EN</button></div><div class="row"><button id="refresh" class="btn blue" hidden data-pt="Atualizar" data-en="Refresh">Atualizar</button><button id="logout" class="btn blue" hidden data-pt="Sair" data-en="Sign out">Sair</button></div></div></div>
<section id="login" class="card login"><h2 data-pt="Acesso administrativo" data-en="Admin access">Acesso administrativo</h2><p class="muted" data-pt="Acesso reservado à administração do TRIÂNGULO." data-en="Access restricted to TRIÂNGULO administration.">Acesso reservado à administração do TRIÂNGULO.</p><input id="email" type="email" autocomplete="username" inputmode="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" data-ph-pt="Password (mín. 6 caracteres)" data-ph-en="Password (min. 6 characters)" placeholder="Password (mín. 6 caracteres)"><div class="row"><button id="signin" class="btn ok" data-pt="Entrar" data-en="Sign in">Entrar</button></div><p id="loginMsg" class="muted"></p></section>
<section id="panel" hidden><div class="grid"><div class="stat"><b id="nPending">0</b><span data-pt="Pendentes" data-en="Pending">Pendentes</span></div><div class="stat"><b id="nProviders">0</b><span data-pt="Prestadores" data-en="Providers">Prestadores</span></div><div class="stat"><b id="nRequests">0</b><span data-pt="Pedidos" data-en="Requests">Pedidos</span></div><div class="stat"><b id="nBookings">0</b><span data-pt="Pedidos diretos" data-en="Direct requests">Pedidos diretos</span></div><div class="stat"><b id="nContacts">0</b><span data-pt="Mensagens" data-en="Messages">Mensagens</span></div></div>
<h2 data-pt="Candidaturas pendentes" data-en="Pending applications">Candidaturas pendentes</h2><div id="apps" class="list"></div><h2 data-pt="Mensagens para o TRIÂNGULO" data-en="Messages to TRIÂNGULO">Mensagens para o TRIÂNGULO</h2><div id="contacts" class="list"></div><h2 data-pt="Pedidos de clientes" data-en="Customer requests">Pedidos de clientes</h2><div id="requests" class="list"></div><h2 data-pt="Pedidos diretos" data-en="Direct requests">Pedidos diretos</h2><div id="bookings" class="list"></div></section>
</main>
<script>
const db=window.supabase.createClient('https://cozamrvrhmwgxbuubjub.supabase.co','sb_publishable_4WXv0AQJ_HceVNnFKcZFHA_TuZPTHd9',{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);const urlLang=new URLSearchParams(location.search).get('lang');let lang=(urlLang==='en'||urlLang==='pt')?urlLang:(localStorage.getItem('tri_lang')||'pt');
function tr(pt,en){return lang==='pt'?pt:en}
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-pt][data-en]').forEach(el=>el.textContent=lang==='pt'?el.dataset.pt:el.dataset.en);
 document.querySelectorAll('[data-ph-pt][data-ph-en]').forEach(el=>el.placeholder=lang==='pt'?el.dataset.phPt:el.dataset.phEn);
 $('#pt').classList.toggle('active',lang==='pt');$('#en').classList.toggle('active',lang==='en');
 document.title=tr('TRIÂNGULO Admin','TRIÂNGULO Admin');
}
$('#pt').onclick=()=>{lang='pt';localStorage.setItem('tri_lang',lang);applyLang();load()};
$('#en').onclick=()=>{lang='en';localStorage.setItem('tri_lang',lang);applyLang();load()};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const encArg=v=>encodeURIComponent(String(v??'')).replace(/'/g,'%27');const CAT={home:['Casa & Limpeza','Home & Cleaning'],garden:['Jardim & Terrenos','Garden & Land'],repairs:['Reparações','Repairs'],moving:['Mudanças & Entregas','Moves & Deliveries'],lessons:['Aulas','Lessons'],wellness:['Bem-estar','Wellness'],tech:['Tecnologia','Technology'],creative:['Fotografia / Criativos','Photography & Creative'],pets:['Animais','Pets'],other:['Outro','Other']};const catLabel=v=>CAT[v]?.[lang==='pt'?0:1]||v||'—';
async function login(){const email=$('#email').value.trim(),password=$('#password').value;$('#loginMsg').textContent=tr('A processar…','Processing…');const res=await db.auth.signInWithPassword({email,password});if(res.error){$('#loginMsg').textContent=res.error.message;return}$('#loginMsg').textContent=tr('Sessão iniciada.','Signed in.');await check()}
$('#signin').onclick=()=>login();$('#email').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#password').focus()}});$('#password').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login()}});$('#refresh').onclick=()=>load();$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function check(){const u=await db.auth.getUser();if(!u.data.user){$('#login').hidden=false;$('#panel').hidden=true;$('#logout').hidden=true;$('#refresh').hidden=true;return}try{const r=await db.from('provider_applications').select('id').limit(1);if(r.error)throw r.error;$('#login').hidden=true;$('#panel').hidden=false;$('#logout').hidden=false;$('#refresh').hidden=false;load()}catch(e){$('#loginMsg').textContent=tr('Conta autenticada, mas este email ainda não está autorizado como administrador do TRIÂNGULO.','Signed in, but this email is not authorized as a TRIÂNGULO administrator.');$('#login').hidden=false;$('#panel').hidden=true;$('#logout').hidden=false;$('#refresh').hidden=true}}
async function load(){
 const [a,p,r,b,c]=await Promise.all([
  db.from('provider_applications').select('*').eq('status','pending').order('created_at',{ascending:true}),
  db.from('providers').select('id'),
  db.from('service_requests').select('*').in('status',['new','matching','offers','confirmed']).order('created_at',{ascending:false}),
  db.from('bookings').select('*,providers(name,business_name)').in('status',['requested','confirmed','declined','expired']).order('created_at',{ascending:false}).limit(50),
  db.from('contact_messages').select('*').eq('status','new').order('created_at',{ascending:false})
 ]);
 $('#nPending').textContent=(a.data||[]).length;$('#nProviders').textContent=(p.data||[]).length;$('#nRequests').textContent=(r.data||[]).length;$('#nBookings').textContent=(b.data||[]).filter(x=>x.status==='requested').length;$('#nContacts').textContent=(c.data||[]).length;
 renderApps(a.data||[]);renderContacts(c.data||[]);renderRequests(r.data||[]);renderBookings(b.data||[]);
}
function renderApps(rows){$('#apps').innerHTML=rows.length?rows.map(x=>'<div class="item"><div class="row"><strong>'+esc(x.business_name||x.name)+'</strong><span class="tag">'+esc(x.base_island)+'</span></div><p>'+esc(x.description)+'</p><div class="muted">'+esc((x.categories||[]).map(catLabel).join(' · '))+'<br>'+esc(x.email||tr('Sem email','No email'))+' · '+esc(x.phone||'')+'<br>'+tr('Trabalha: ','Works in: ')+esc((x.service_islands||[]).join(', '))+(x.other_service?'<br>'+tr('Outro serviço: ','Other service: ')+esc(x.other_service):'')+'<br>'+tr('Preço: ','Price: ')+(x.pricing_type==='quote'||x.price==null?tr('Sob orçamento','Quote required'):'€'+esc(x.price)+' · '+esc(x.pricing_type))+' · '+tr('Disponibilidade: ','Availability: ')+esc(x.availability||'—')+(x.website?'<br>Website: '+esc(x.website):'')+(x.referred_by?'<br>'+tr('Conheceu o TRIÂNGULO por: ','Heard about TRIÂNGULO via: ')+esc(x.referred_by):'')+'<br>'+tr('Recebida: ','Received: ')+new Date(x.created_at).toLocaleString(lang==='pt'?'pt-PT':'en-GB')+'</div><div class="row" style="margin-top:10px"><button class="btn ok" onclick="approve(\''+x.id+'\','+(x.email?'false':'true')+')">'+tr('Aprovar','Approve')+'</button><button class="btn wa" onclick="whatsappApplication(\''+x.id+'\',\''+encArg(x.phone||'')+'\',\''+encArg(x.name||x.business_name||'')+'\')">WhatsApp</button><button class="btn no" onclick="rejectApp(\''+x.id+'\')">'+tr('Recusar','Reject')+'</button></div></div>').join(''):'<div class="item muted">'+tr('Sem candidaturas pendentes.','No pending applications.')+'</div>'}
async function approve(id,needsWhatsApp=false){
  if(!confirm(tr('Aprovar este prestador?','Approve this provider?')))return;
  let accessWin=null;
  if(needsWhatsApp){
    accessWin=window.open('about:blank','triangulo_provider_access');
    if(accessWin){accessWin.document.title='TRIÂNGULO';accessWin.document.body.innerHTML='<p style="font-family:system-ui;padding:24px;color:#153458">'+tr('A preparar acesso por WhatsApp…','Preparing WhatsApp access…')+'</p>'}
  }
  const r=await db.rpc('approve_provider_with_access',{application_id:id});
  if(r.error||!r.data||!r.data.ok){
    if(accessWin)accessWin.close();
    alert((r.error&&r.error.message)||tr('Não foi possível aprovar.','Could not approve.'));
    return;
  }
  if(r.data.setup_channel==='whatsapp'&&r.data.setup_phone&&r.data.setup_message){
    const digits=String(r.data.setup_phone).replace(/\D/g,'').replace(/^00/,'');
    const url='https://wa.me/'+digits+'?text='+encodeURIComponent(r.data.setup_message);
    if(accessWin)accessWin.location.href=url;
    else window.open(url,'_blank','noopener');
  }else if(accessWin){accessWin.close()}
  load();
}
async function rejectApp(id){const note=prompt(tr('Motivo/notas (opcional):','Reason/notes (optional):'))||null;const r=await db.rpc('reject_provider',{application_id:id,note});if(r.error)alert(r.error.message);else load()}
function renderContacts(rows){$('#contacts').innerHTML=rows.length?rows.map(x=>'<div class="item"><div class="row"><strong>'+esc(x.subject||tr('Mensagem','Message'))+'</strong><span class="tag">'+esc(x.locale||'pt')+'</span></div><p>'+esc(x.message)+'</p><div class="muted">'+esc(x.name||'')+' · '+esc(x.email)+'<br>'+new Date(x.created_at).toLocaleString(lang==='pt'?'pt-PT':'en-GB')+'</div><div class="row" style="margin-top:10px"><button class="btn blue" onclick="setContactStatus(\''+x.id+'\',\'read\')">'+tr('Marcar como lida','Mark as read')+'</button><button class="btn no" onclick="setContactStatus(\''+x.id+'\',\'closed\')">'+tr('Fechar','Close')+'</button></div></div>').join(''):'<div class="item muted">'+tr('Sem mensagens novas.','No new messages.')+'</div>'}
async function setContactStatus(id,status){const r=await db.from('contact_messages').update({status}).eq('id',id);if(r.error)alert(r.error.message);else load()}
function requestStatusLabel(s){const pt={new:'Novo',matching:'A procurar prestadores',offers:'Respostas disponíveis',confirmed:'Serviço confirmado',completed:'Concluído',cancelled:'Cancelado'};const en={new:'New',matching:'Finding providers',offers:'Responses available',confirmed:'Service confirmed',completed:'Completed',cancelled:'Cancelled'};return (lang==='pt'?pt:en)[s]||s}
function renderRequests(rows){$('#requests').innerHTML=rows.length?rows.map(x=>'<div class="item"><div class="row"><strong>'+esc(x.description)+'</strong><span class="tag">'+esc(requestStatusLabel(x.status))+'</span></div><div class="muted">📍 '+esc(x.island)+' · '+esc(x.location_text||'—')+' · '+esc(x.requested_date||tr('sem data','no date'))+'<br>'+esc(x.client_name||'')+' · '+esc(x.client_email||'')+' · '+esc(x.client_phone||'')+'<br>'+tr('Categoria: ','Category: ')+esc(catLabel(x.category_code))+' · '+tr('Orçamento: ','Budget: ')+(x.budget==null?'—':'€'+x.budget)+'<br>'+tr('Recebido: ','Received: ')+new Date(x.created_at).toLocaleString(lang==='pt'?'pt-PT':'en-GB')+'</div><div class="row" style="margin-top:10px">'+(x.client_phone?'<button class="btn wa" onclick="whatsappRequestClient(\''+x.id+'\',\''+encArg(x.client_phone||'')+'\',\''+encArg(x.client_name||'')+'\')">'+tr('WhatsApp ao cliente','WhatsApp customer')+'</button>':'')+(x.status==='confirmed'?'<button class="btn blue" onclick="setRequestStatus(\''+x.id+'\',\'completed\')">'+tr('Concluir','Complete')+'</button>':'')+(x.status!=='completed'&&x.status!=='cancelled'?'<button class="btn no" onclick="setRequestStatus(\''+x.id+'\',\'cancelled\')">'+tr('Cancelar','Cancel')+'</button>':'')+'</div></div>').join(''):'<div class="item muted">'+tr('Sem pedidos ativos.','No active requests.')+'</div>'}
async function setRequestStatus(id,status){const r=await db.from('service_requests').update({status}).eq('id',id);if(r.error)alert(r.error.message);else load()}
function bookingStatusLabel(s){return s==='requested'?tr('A aguardar prestador','Awaiting provider'):s==='confirmed'?tr('Confirmado','Confirmed'):s==='declined'?tr('Recusado','Declined'):s==='expired'?tr('Expirado','Expired'):s==='completed'?tr('Concluído','Completed'):s==='cancelled'?tr('Cancelado','Cancelled'):s}
function renderBookings(rows){$('#bookings').innerHTML=rows.length?rows.map(x=>'<div class="item"><div class="row"><strong>'+esc((x.providers&&(x.providers.business_name||x.providers.name))||tr('Prestador','Provider'))+'</strong><span class="tag">'+esc(bookingStatusLabel(x.status))+'</span></div><div class="muted">'+esc(x.service_date)+' · '+esc(x.service_time||'—')+' · '+esc(x.island)+'<br>'+esc(x.client_name||'')+' · '+esc(x.client_email)+' · '+esc(x.client_phone||'')+(x.notes?'<br>'+tr('Nota: ','Note: ')+esc(x.notes):'')+(x.status==='requested'&&x.provider_response_deadline?'<br>⏳ '+tr('Responder até: ','Reply by: ')+new Date(x.provider_response_deadline).toLocaleString(lang==='pt'?'pt-PT':'en-GB'):'')+'<br>'+tr('Recebida: ','Received: ')+new Date(x.created_at).toLocaleString(lang==='pt'?'pt-PT':'en-GB')+'</div><div class="row" style="margin-top:10px">'+(x.status==='requested'?'<button class="btn ok" onclick="sendBookingWhatsApp(\''+x.id+'\')">'+tr('WhatsApp ao prestador','WhatsApp provider')+'</button>':'')+(x.status==='confirmed'?'<button class="btn blue" onclick="setBookingStatus(\''+x.id+'\',\'completed\')">'+tr('Concluir','Complete')+'</button>':'')+((x.status==='requested'||x.status==='confirmed')?'<button class="btn no" onclick="setBookingStatus(\''+x.id+'\',\'cancelled\')">'+tr('Cancelar','Cancel')+'</button>':'')+'</div></div>').join(''):'<div class="item muted">'+tr('Sem pedidos diretos recentes.','No recent direct requests.')+'</div>'}
function waPhone(raw){let p=String(raw||'').replace(/\D/g,'');if(!p)return'';if(p.startsWith('00351'))p=p.slice(2);if(p.length===9&&p.startsWith('9'))p='351'+p;return p}
function openWhatsApp(raw,message){const phone=waPhone(raw);if(!phone){alert(tr('Não existe um número de WhatsApp válido.','There is no valid WhatsApp number.'));return}window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer')}
function whatsappApplication(id,phoneEnc,nameEnc){const phone=decodeURIComponent(phoneEnc||''),name=decodeURIComponent(nameEnc||'');openWhatsApp(phone,lang==='pt'?'Olá '+(name||'')+'! Falo do TRIÂNGULO. Recebemos a tua candidatura de prestador e estou a entrar em contacto por aqui para facilitar a comunicação.':'Hello '+(name||'')+'! This is TRIÂNGULO. We received your provider application and I am contacting you here to make communication easier.')}
function whatsappRequestClient(id,phoneEnc,nameEnc){const phone=decodeURIComponent(phoneEnc||''),name=decodeURIComponent(nameEnc||'');openWhatsApp(phone,lang==='pt'?'Olá '+(name||'')+'! Falo do TRIÂNGULO. Recebemos o teu pedido de serviço e estou a entrar em contacto por WhatsApp para facilitar o acompanhamento.':'Hello '+(name||'')+'! This is TRIÂNGULO. We received your service request and I am contacting you on WhatsApp to make follow-up easier.')}
async function sendBookingWhatsApp(id){const r=await db.rpc('admin_booking_whatsapp',{p_booking_id:id});if(r.error){alert(r.error.message);return}openWhatsApp(r.data.phone||'',String(r.data.message||''))}
async function setBookingStatus(id,status){const r=await db.from('bookings').update({status}).eq('id',id);if(r.error)alert(r.error.message);else load()}
db.auth.onAuthStateChange(()=>check());applyLang();check();
</script></body></html>
