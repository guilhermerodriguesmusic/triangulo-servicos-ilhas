<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRIÂNGULO Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef7fc;font-family:Inter,system-ui,-apple-system,sans-serif;color:#153458}main{max-width:1050px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.top img{width:40px;vertical-align:middle}.card{background:#fff;border:1px solid #dde7ef;border-radius:16px;padding:15px;margin-bottom:12px}.login{max-width:420px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;border-radius:14px;padding:14px;text-align:center}.stat b{font-size:25px;display:block}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid #dde7ef;border-radius:15px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#6b8095;font-size:12px}.tag{background:#eef6fb;border-radius:999px;padding:4px 7px;font-size:10px}.btn{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.ok{background:#14aa7d;color:#fff}.no{background:#ffe6e8;color:#9b2230}.blue{background:#e8f4ff;color:#1269b0}input{width:100%;padding:11px;border:1px solid #d8e3eb;border-radius:10px;margin:5px 0 10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="top"><div><img src="logo.svg"> <strong>TRIÂNGULO ADMIN</strong></div><div class="row"><button id="refresh" class="btn blue" hidden>Atualizar</button><button id="logout" class="btn blue" hidden>Sair</button></div></div>
<section id="login" class="card login"><h2>Acesso administrativo</h2><p class="muted">Acesso reservado à administração do TRIÂNGULO.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (mín. 6 caracteres)"><div class="row"><button id="signin" class="btn ok">Entrar</button></div><p id="loginMsg" class="muted"></p></section>
<section id="panel" hidden><div class="grid"><div class="stat"><b id="nPending">0</b>Pendentes</div><div class="stat"><b id="nProviders">0</b>Prestadores</div><div class="stat"><b id="nRequests">0</b>Pedidos</div><div class="stat"><b id="nBookings">0</b>Reservas</div><div class="stat"><b id="nContacts">0</b>Mensagens</div></div>
<h2>Candidaturas pendentes</h2><div id="apps" class="list"></div><h2>Mensagens para o TRIÂNGULO</h2><div id="contacts" class="list"></div><h2>Pedidos de clientes</h2><div id="requests" class="list"></div><h2>Reservas beta</h2><div id="bookings" class="list"></div></section>
</main>
<script>
const db=window.supabase.createClient('https://cozamrvrhmwgxbuubjub.supabase.co','sb_publishable_4WXv0AQJ_HceVNnFKcZFHA_TuZPTHd9',{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function login(){const email=$('#email').value.trim(),password=$('#password').value;$('#loginMsg').textContent='A processar…';const res=await db.auth.signInWithPassword({email,password});if(res.error){$('#loginMsg').textContent=res.error.message;return}$('#loginMsg').textContent='Sessão iniciada.';await check()}
$('#signin').onclick=()=>login();$('#refresh').onclick=()=>load();$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function check(){const u=await db.auth.getUser();if(!u.data.user){$('#login').hidden=false;$('#panel').hidden=true;$('#logout').hidden=true;$('#refresh').hidden=true;return}try{const r=await db.from('provider_applications').select('id').limit(1);if(r.error)throw r.error;$('#login').hidden=true;$('#panel').hidden=false;$('#logout').hidden=false;$('#refresh').hidden=false;load()}catch(e){$('#loginMsg').textContent='Conta autenticada, mas este email ainda não está autorizado como administrador do TRIÂNGULO.';$('#login').hidden=false;$('#panel').hidden=true;$('#logout').hidden=false;$('#refresh').hidden=true}}
async function load(){
 const [a,p,r,b,c]=await Promise.all([
  db.from('provider_applications').select('*').eq('status','pending').order('created_at',{ascending:true}),
  db.from('providers').select('id'),
  db.from('service_requests').select('*').eq('status','new').order('created_at',{ascending:false}),
  db.from('bookings').select('*,providers(name,business_name)').in('status',['requested','confirmed','declined','expired']).order('created_at',{ascending:false}).limit(50),
  db.from('contact_messages').select('*').eq('status','new').order('created_at',{ascending:false})
 ]);
 $('#nPending').textContent=(a.data||[]).length;$('#nProviders').textContent=(p.data||[]).length;$('#nRequests').textContent=(r.data||[]).length;$('#nBookings').textContent=(b.data||[]).filter(x=>x.status==='requested').length;$('#nContacts').textContent=(c.data||[]).length;
 renderApps(a.data||[]);renderContacts(c.data||[]);renderRequests(r.data||[]);renderBookings(b.data||[]);
}
function renderApps(rows){$('#apps').innerHTML=rows.length?rows.map(x=>'<div class="item"><div class="row"><strong>'+esc(x.business_name||x.name)+'</strong><span class="tag">'+esc(x.base_island)+'</span></div><p>'+esc(x.description)+'</p><div class="muted">'+esc((x.categories||[]).join(' · '))+'<br>'+esc(x.email)+' · '+esc(x.phone||'')+'<br>Trabalha: '+esc((x.service_islands||[]).join(', '))+'<br>Preço: '+(x.pricing_type==='quote'||x.price==null?'Sob orçamento':'€'+esc(x.price)+' · '+esc(x.pricing_type))+' · Disponibilidade: '+esc(x.availability||'—')+(x.available_today?' · disponível hoje':'')+(x.website?'<br>Website: '+esc(x.website):'')+(x.founder_program?'<br>⭐ Prestador Fundador':'')+(x.referred_by?'<br>Recomendado por: '+esc(x.referred_by):'')+'<br>Recebida: '+new Date(x.created_at).toLocaleString('pt-PT')+'</div><div class="row" style="margin-top:10px"><button class="btn ok" onclick="approve(\''+x.id+'\')">Aprovar</button><button class="btn no" onclick="rejectApp(\''+x.id+'\')">Recusar</button></div></div>').join(''):'<div class="item muted">Sem candidaturas pendentes.</div>'}
async function approve(id){if(!confirm('Aprovar este prestador?'))return;const r=await db.rpc('approve_provider',{application_id:id});if(r.error)alert(r.error.message);else load()}
async function rejectApp(id){const note=prompt('Motivo/notas (opcional):')||null;const r=await db.rpc('reject_provider',{application_id:id,note});if(r.error)alert(r.error.message);else load()}
function renderContacts(rows){$('#contacts').innerHTML=rows.length?rows.map(x=>'<div class="item"><div class="row"><strong>'+esc(x.subject||'Mensagem')+'</strong><span class="tag">'+esc(x.locale||'pt')+'</span></div><p>'+esc(x.message)+'</p><div class="muted">'+esc(x.name||'')+' · '+esc(x.email)+'<br>'+new Date(x.created_at).toLocaleString('pt-PT')+'</div><div class="row" style="margin-top:10px"><button class="btn blue" onclick="setContactStatus(\''+x.id+'\',\'read\')">Marcar como lida</button><button class="btn no" onclick="setContactStatus(\''+x.id+'\',\'closed\')">Fechar</button></div></div>').join(''):'<div class="item muted">Sem mensagens novas.</div>'}
async function setContactStatus(id,status){const r=await db.from('contact_messages').update({status}).eq('id',id);if(r.error)alert(r.error.message);else load()}
function renderRequests(rows){$('#requests').innerHTML=rows.length?rows.map(x=>'<div class="item"><strong>'+esc(x.description)+'</strong><div class="muted">📍 '+esc(x.island)+' · '+esc(x.location_text||'—')+' · '+esc(x.requested_date||'sem data')+'<br>'+esc(x.client_name||'')+' · '+esc(x.client_email||'')+' · '+esc(x.client_phone||'')+'<br>Orçamento: '+(x.budget==null?'—':'€'+x.budget)+' · Recebido: '+new Date(x.created_at).toLocaleString('pt-PT')+'</div><div class="row" style="margin-top:10px"><button class="btn ok" onclick="setRequestStatus(\''+x.id+'\',\'matched\')">Encontrado prestador</button><button class="btn blue" onclick="setRequestStatus(\''+x.id+'\',\'closed\')">Fechar</button><button class="btn no" onclick="setRequestStatus(\''+x.id+'\',\'cancelled\')">Cancelar</button></div></div>').join(''):'<div class="item muted">Sem pedidos novos.</div>'}
async function setRequestStatus(id,status){const r=await db.from('service_requests').update({status}).eq('id',id);if(r.error)alert(r.error.message);else load()}
function bookingStatusLabel(s){return s==='requested'?'A aguardar prestador':s==='confirmed'?'Confirmada':s==='declined'?'Recusada':s==='expired'?'Expirada':s==='completed'?'Concluída':s==='cancelled'?'Cancelada':s}
function renderBookings(rows){$('#bookings').innerHTML=rows.length?rows.map(x=>'<div class="item"><div class="row"><strong>'+esc((x.providers&&(x.providers.business_name||x.providers.name))||'Prestador')+'</strong><span class="tag">'+esc(bookingStatusLabel(x.status))+'</span></div><div class="muted">'+esc(x.service_date)+' · '+esc(x.service_time||'—')+' · '+esc(x.island)+'<br>'+esc(x.client_name||'')+' · '+esc(x.client_email)+' · '+esc(x.client_phone||'')+(x.notes?'<br>Nota: '+esc(x.notes):'')+(x.status==='requested'&&x.provider_response_deadline?'<br>⏳ Responder até: '+new Date(x.provider_response_deadline).toLocaleString('pt-PT'):'')+'<br>Recebida: '+new Date(x.created_at).toLocaleString('pt-PT')+'</div><div class="row" style="margin-top:10px">'+(x.status==='confirmed'?'<button class="btn blue" onclick="setBookingStatus(\''+x.id+'\',\'completed\')">Concluir</button>':'')+((x.status==='requested'||x.status==='confirmed')?'<button class="btn no" onclick="setBookingStatus(\''+x.id+'\',\'cancelled\')">Cancelar</button>':'')+'</div></div>').join(''):'<div class="item muted">Sem reservas recentes.</div>'}
async function setBookingStatus(id,status){const r=await db.from('bookings').update({status}).eq('id',id);if(r.error)alert(r.error.message);else load()}
db.auth.onAuthStateChange(()=>check());check();
</script></body></html>
