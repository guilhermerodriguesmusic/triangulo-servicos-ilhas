name: Replace Pico HQ hero
on:
  push:
    paths:
      - '.github/workflows/replace-pico-hq.yml'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download original 4:3 Pico photo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ed88-8210-aa3f-cb80f853f8c9/raw?se=2026-09-21T10%3A33%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=2a268cf0-c1dc-5ca1-81c7-5c6fd3f56007&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T09%3A46%3A19Z&ske=2026-09-22T09%3A46%3A19Z&sks=b&skv=2026-02-06&sig=cxdGgm7e/e8MWkMQZgyPhEvFfxhEzOFAiB7su2yJA80%3D' -o assets/pico-home-hq.webp
          test "$(wc -c < assets/pico-home-hq.webp)" -gt 900000
      - name: Commit original HQ photo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pico-home-hq.webp
          git commit -m "Use original high quality Pico hero"
          git push
