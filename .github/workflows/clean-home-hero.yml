name: Build clean homepage hero

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/clean-home-hero.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean power lines from local high-resolution source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow opencv-python-headless
          python3 - <<'PY'
          import cv2
          import numpy as np
          from pathlib import Path

          src = Path("assets/pico-home-hq.webp")
          img = cv2.imread(str(src), cv2.IMREAD_COLOR)
          if img is None:
              raise SystemExit("Could not decode pico-home-hq.webp")
          h, w = img.shape[:2]
          print(f"source={w}x{h}")

          mask = np.zeros((h, w), dtype=np.uint8)
          def line(x1,y1,x2,y2,t=0.0045):
              cv2.line(
                  mask,
                  (round(w*x1), round(h*y1)),
                  (round(w*x2), round(h*y2)),
                  255,
                  max(3, round(min(w,h)*t)),
                  cv2.LINE_AA
              )

          # Power lines visible across the sky. Coordinates are normalized so
          # this remains stable if the source is re-encoded at the same crop.
          line(-0.02,0.270,0.825,0.078,0.0040)
          line(-0.02,0.337,0.835,0.300,0.0045)
          line(-0.02,0.383,0.830,0.323,0.0045)
          line(-0.02,0.405,0.827,0.340,0.0045)
          line(-0.02,0.431,0.824,0.355,0.0045)

          # Slight dilation catches antialiased/dark edges around each cable.
          kernel = np.ones((3,3), np.uint8)
          mask = cv2.dilate(mask, kernel, iterations=1)

          clean = cv2.inpaint(img, mask, 5, cv2.INPAINT_TELEA)
          ok = cv2.imwrite("assets/pico-home-clean.webp", clean, [cv2.IMWRITE_WEBP_QUALITY, 94])
          if not ok:
              raise SystemExit("Could not write clean hero")
          print("wrote assets/pico-home-clean.webp")

      - name: Commit clean local hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pico-home-clean.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add clean local homepage hero"
          git push
