name: Deploy TRIÂNGULO to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/
          if grep -R -E "https://(commons|upload)\\.wikimedia\\.org" \
            --include="*.html" --include="*.css" --include="*.js" _site; then
            echo "External Wikimedia dependency returned"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live TRIÂNGULO
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "VERIFY FAILED at line $LINENO: $BASH_COMMAND"' ERR
          base="https://trianguloacores.pt"
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 30 "$1"
          }

          index="$(fetch "$base/?verify=$GITHUB_SHA")"
          providers="$(fetch "$base/prestadores.html?verify=$GITHUB_SHA")"
          application="$(fetch "$base/candidatura-prestador.html?verify=$GITHUB_SHA")"
          review="$(fetch "$base/candidatura-rever.html?verify=$GITHUB_SHA")"
          admin="$(fetch "$base/admin.html?verify=$GITHUB_SHA")"
          terms="$(fetch "$base/terms.html?verify=$GITHUB_SHA")"
          privacy="$(fetch "$base/privacy.html?verify=$GITHUB_SHA")"
          how="$(fetch "$base/how-it-works.html?verify=$GITHUB_SHA")"
          about="$(fetch "$base/sobre-nos.html?verify=$GITHUB_SHA")"
          legacy_reply="$(fetch "$base/reserva-responder.html?verify=$GITHUB_SHA")"
          install_page="$(fetch "$base/instalar/?verify=$GITHUB_SHA")"
          live_apple_icon="/tmp/tri-live-apple-touch-icon.png"
          live_precomposed_icon="/tmp/tri-live-apple-touch-icon-precomposed.png"
          wait_for_match() {
            local expected="$1" url="$2" output="$3"
            for attempt in {1..12}; do
              curl --fail --silent --show-error --location \
                --retry 3 --retry-all-errors --retry-delay 1 \
                "$url?verify=$GITHUB_SHA&attempt=$attempt" -o "$output"
              if cmp -s "$expected" "$output"; then
                return 0
              fi
              sleep 2
            done
            echo "Live asset did not match deployed artifact after cache-propagation retries: $url"
            return 1
          }
          wait_for_match apple-touch-icon.png "$base/apple-touch-icon.png" "$live_apple_icon"
          wait_for_match apple-touch-icon-precomposed.png "$base/apple-touch-icon-precomposed.png" "$live_precomposed_icon"
          app_redirect="$(fetch "$base/app.html?verify=$GITHUB_SHA")"
          home_redirect="$(fetch "$base/inicio.html?verify=$GITHUB_SHA")"
          app="$(fetch "$base/servicos/?verify=$GITHUB_SHA")"
          provider_area="$(fetch "$base/servicos/provider-area.js?verify=$GITHUB_SHA")"
          manifest="$(fetch "$base/manifest.json?verify=$GITHUB_SHA")"
          sw="$(fetch "$base/sw.js?verify=$GITHUB_SHA")"
          robots="$(fetch "$base/robots.txt?verify=$GITHUB_SHA")"
          sitemap="$(fetch "$base/sitemap.xml?verify=$GITHUB_SHA")"

          grep -q "TRIÂNGULO" <<<"$index"
          grep -q 'class="searchbar"' <<<"$index"
          grep -q 'data-group="home"' <<<"$index"
          grep -q 'data-group="repairs"' <<<"$index"
          grep -q "PARA PRESTADORES" <<<"$providers"
          grep -q 'candidatura-prestador.html?invite=site-prestadores' <<<"$providers"
          grep -q "Criar perfil gratuito" <<<"$providers"
          grep -q "Sem email?" <<<"$providers"
          grep -q "Valor do serviço" <<<"$application"
          grep -q "Telefone / WhatsApp" <<<"$application"
          grep -q "Email (opcional)" <<<"$application"
          grep -q "Email não é obrigatório" <<<"$application"
          grep -q "Etapas da candidatura" <<<"$application"
          grep -q "Application steps" <<<"$application"
          grep -q "Localidade / freguesia" <<<"$application"
          grep -q "Review Application" <<<"$review"
          grep -q "TRIÂNGULO Admin" <<<"$admin"
          grep -q "Pending applications" <<<"$admin"
          grep -q "booking_client_context" <<<"$app"
          grep -q "stripe-create-checkout" <<<"$app"
          grep -q "Confirmar e pagar" <<<"$app"
          grep -q "loadAppConfig" <<<"$app"
          grep -q "Email ou telefone" <<<"$app"
          grep -q "provider_password_login" <<<"$provider_area"
          grep -q "request_provider_password_reset" <<<"$provider_area"
          grep -q "Pagamentos em breve" <<<"$app"
          grep -q "Termos de Utilização" <<<"$terms"
          grep -q "Terms of Use" <<<"$terms"
          grep -q "Política de Privacidade" <<<"$privacy"
          grep -q "Privacy Policy" <<<"$privacy"
          grep -q "pagamentos automáticos ainda não estão ativos" <<<"$how"
          grep -q "How it works" <<<"$how"
          grep -q "Três ilhas. Uma rede local." <<<"$about"
          grep -q "/sobre-nos.html" <<<"$index"
          grep -q "Prestas este serviço? Junta-te ao TRIÂNGULO" <<<"$app"
          grep -q "Como funciona" <<<"$app"
          grep -q "Privacidade" <<<"$app"
          grep -q "Termos" <<<"$app"
          grep -q "booking_token" <<<"$legacy_reply"
          grep -q '<title>Instalar TRIÂNGULO — Açores</title>' <<<"$install_page"
          grep -q 'href="/apple-touch-icon.png"' <<<"$install_page"
          grep -q 'href="/apple-touch-icon-precomposed.png"' <<<"$install_page"
          grep -q "Instalar TRIÂNGULO" <<<"$install_page"
          grep -q "beforeinstallprompt" <<<"$install_page"
          grep -q "package=com.android.chrome" <<<"$install_page"
          grep -q "Install TRIÂNGULO" <<<"$install_page"
          grep -q "Already have a profile? Sign in" <<<"$providers"
          grep -q "Local services across the islands" <<<"$index"
          grep -q "Provider sign-in" <<<"$app"
          grep -q '"sizes": "192x192"' <<<"$manifest"
          grep -q '"sizes": "512x512"' <<<"$manifest"
          grep -q "/servicos/" <<<"$app_redirect"
          grep -q "location.replace('/'+location.search+location.hash)" <<<"$home_redirect"
          grep -q '"start_url": "/servicos/?app=1"' <<<"$manifest"
          grep -q '"display": "standalone"' <<<"$manifest"
          grep -q '"shortcuts"' <<<"$manifest"
          grep -q "triangulo-pwa-" <<<"$sw"
          grep -q "Sitemap: https://trianguloacores.pt/sitemap.xml" <<<"$robots"
          grep -q "https://trianguloacores.pt/prestadores.html" <<<"$sitemap"
          grep -q "https://trianguloacores.pt/sobre-nos.html" <<<"$sitemap"
          grep -q 'hreflang="pt-PT"' <<<"$sitemap"
          grep -q 'hreflang="en"' <<<"$sitemap"
          grep -q 'localized-seo-sync' <<<"$index"
          grep -q 'localized-seo-sync' <<<"$providers"
          grep -q 'localized-seo-sync' <<<"$application"

          if grep -Eqi "Fundador|Founding Service Provider|Founding Credit" <<<"$providers$application$terms$app"; then
            echo "Obsolete founding-provider copy is still public"
            exit 1
          fi

          if grep -q ".wrap>section[data-en]" <<<"$privacy$terms$how$about"; then
            echo "Language-section selector regression"
            exit 1
          fi

          if grep -q "#app" <<<"$index$app"; then
            echo "Legacy #app navigation returned"
            exit 1
          fi

          if grep -Eq '(^|[^$])\$\([^)]*\)\.(forEach|map|filter|some|every|reduce)\(' <<<"$application$app"; then
            echo "querySelector helper used as a collection"
            exit 1
          fi

          # Smoke-test every public HTML entry in both supported languages.
          for page in \
            "admin.html" "app.html" "candidatura-prestador.html" "candidatura-rever.html" \
            "how-it-works.html" "index.html" "inicio.html" "instalar/" "prestadores.html" \
            "privacy.html" "reserva-responder.html" "servicos/" "sobre-nos.html" "terms.html"; do
            fetch "$base/$page?lang=pt&verify=$GITHUB_SHA" >/dev/null
            fetch "$base/$page?lang=en&verify=$GITHUB_SHA" >/dev/null
          done

          # Dedicated static English entry points: stable URLs for SEO and no-JS metadata.
          for page in \
            "en/" "en/servicos/" "en/prestadores.html" "en/candidatura-prestador.html" \
            "en/how-it-works.html" "en/sobre-nos.html" "en/privacy.html" \
            "en/terms.html" "en/instalar/"; do
            english_page="$(fetch "$base/$page?verify=$GITHUB_SHA")"
            grep -q 'lang="en"' <<<"$english_page"
            grep -q 'force-english-entry' <<<"$english_page"
          done

          # Verify only versioned/local assets committed with the site.
          fetch "$base/assets/pico-home-hq.webp?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/assets/home-master.webp?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/assets/home-master-2x.webp?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/assets/island-pico.jpg?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/assets/island-faial.jpg?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/assets/island-sao-jorge.jpg?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/assets/provider-area-pico.jpg?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/icon-192.png?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/icon-512.png?verify=$GITHUB_SHA" >/dev/null

          if curl --fail --silent --location "$base/checkout-teste-20260920.html?verify=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Temporary checkout test page is still publicly reachable"
            exit 1
          fi

          echo "Live site verification OK: $base"
