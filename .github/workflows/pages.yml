name: Deploy TRIÂNGULO to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fetch real island photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 --retry-delay 2 "https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Ilha_do_Pico%2C_Montanha_ao_nascer_do_Sol%2C_A%C3%A7ores%2C_Portugal.JPG/1280px-Ilha_do_Pico%2C_Montanha_ao_nascer_do_Sol%2C_A%C3%A7ores%2C_Portugal.JPG" -o assets/pico-real.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mt._Pico%2C_Azores_%286025734835%29.jpg?width=1920" -o assets/pico-hero-real.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Cidade_da_Horta%2C_vista_parcial_do_cimo_do_Miradouro_de_Nossa_Senhora_da_Concei%C3%A7%C3%A3o%2C_concelho_da_Horta%2C_ilha_do_Faial%2C_A%C3%A7ores%2C_Porttugal.JPG?width=1280" -o assets/faial-real.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Faj%C3%A3_de_S%C3%A3o_Jo%C3%A3o%2C_vista%2C_Calheta%2C_S%C3%A3o_Jorge%2C_A%C3%A7ores.JPG?width=1280" -o assets/sao-jorge-real.jpg
          test -s assets/pico-real.jpg
          test -s assets/pico-hero-real.jpg
          test -s assets/faial-real.jpg
          test -s assets/sao-jorge-real.jpg
          file assets/pico-real.jpg assets/pico-hero-real.jpg assets/faial-real.jpg assets/sao-jorge-real.jpg
      - name: Generate TRIÂNGULO app icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet cairosvg
          mkdir -p icons
          python - <<'PY'
          import base64
          import cairosvg
          from pathlib import Path

          logo = Path("logo.svg").read_bytes()
          logo_data = base64.b64encode(logo).decode("ascii")

          def make_icon(size, mark_ratio, output):
              mark = round(size * mark_ratio)
              pos = (size - mark) // 2
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{size}" height="{size}" viewBox="0 0 {size} {size}">
                <defs>
                  <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
                    <stop offset="0" stop-color="#10355f"/>
                    <stop offset="1" stop-color="#187fab"/>
                  </linearGradient>
                  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
                    <feDropShadow dx="0" dy="{max(3, round(size*.018))}" stdDeviation="{max(3, round(size*.012))}" flood-color="#062844" flood-opacity=".35"/>
                  </filter>
                </defs>
                <rect width="{size}" height="{size}" fill="url(#bg)"/>
                <circle cx="{size/2}" cy="{size/2}" r="{size*.30}" fill="#ffffff" opacity=".035"/>
                <image href="data:image/svg+xml;base64,{logo_data}" x="{pos}" y="{pos}" width="{mark}" height="{mark}" filter="url(#shadow)"/>
              </svg>'''
              cairosvg.svg2png(bytestring=svg.encode(), write_to=output, output_width=size, output_height=size)

          make_icon(180, .62, "icons/triangulo-blue-180.png")
          make_icon(192, .62, "icons/triangulo-blue-192.png")
          make_icon(512, .62, "icons/triangulo-blue-512.png")
          make_icon(512, .52, "icons/triangulo-blue-maskable-512.png")
          PY
          test -s icons/triangulo-blue-180.png
          test -s icons/triangulo-blue-192.png
          test -s icons/triangulo-blue-512.png
          test -s icons/triangulo-blue-maskable-512.png
      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            --exclude='_site' \
            ./ _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live TRIÂNGULO
        shell: bash
        run: |
          set -euo pipefail
          base="https://trianguloacores.pt"
          fetch() {
            local url="$1"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 30 \
              "$url"
          }

          index="$(fetch "$base/?verify=$GITHUB_SHA")"
          providers="$(fetch "$base/prestadores.html?verify=$GITHUB_SHA")"
          application="$(fetch "$base/candidatura-prestador.html?verify=$GITHUB_SHA")"
          terms="$(fetch "$base/terms.html?verify=$GITHUB_SHA")"
          privacy="$(fetch "$base/privacy.html?verify=$GITHUB_SHA")"
          app="$(fetch "$base/app.html?verify=$GITHUB_SHA")"
          manifest="$(fetch "$base/manifest.json?verify=$GITHUB_SHA")"
          sw="$(fetch "$base/sw.js?verify=$GITHUB_SHA")"

          grep -q "Bem-vindo ao TRIÂNGULO Açores" <<<"$index"
          grep -q "Entrar no TRIÂNGULO" <<<"$index"
          grep -q "Fazes um serviço nas ilhas" <<<"$providers"
          grep -q "Criar o meu perfil" <<<"$providers"
          grep -q "worker-illustration" <<<"$providers"
          grep -q "Como conheceste o TRIÂNGULO" <<<"$application"
          grep -q "comissão de 15%" <<<"$application"
          grep -q "Podes pedir a alteração dos teus dados" <<<"$application"
          grep -q "email a confirmar a receção" <<<"$application"
          ! grep -q "Ilha onde estás baseado" <<<"$application"
          ! grep -q "Prestador Fundador" <<<"$application"
          ! grep -q "founder_program" <<<"$application"
          ! grep -q "Estou disponível hoje" <<<"$application"
          grep -q "provider_account_context" <<<"$app"
          grep -q "provider_update_profile" <<<"$app"
          grep -q "Entrar como prestador" <<<"$app"
          grep -q "Publica um pedido para hoje." <<<"$app"
          ! grep -q "available_today" <<<"$app"
          grep -q "Termos de Utilização" <<<"$terms"
          grep -q "Versão em vigor: 20/09/2026" <<<"$terms"
          ! grep -q "Termos do Beta" <<<"$terms"
          grep -q "Política de Privacidade" <<<"$privacy"
          grep -q "Responsável pelo tratamento" <<<"$privacy"
          ! grep -q "Rascunho operacional" <<<"$privacy"
          grep -q "Encontra. Pede. Resolve." <<<"$app"
          grep -q "ONDE PRECISAS DE AJUDA?" <<<"$app"
          grep -q 'name="triangulo-build" content="provider-account-v2-20260920"' <<<"$app"
          grep -q "És prestador? Entrar" <<<"$app"
          grep -q "Pedido simples" <<<"$app"
          grep -q "Área do prestador" <<<"$app"
          grep -q "booking_response_context" <<<"$app"
          grep -q "booking_token" <<<"$app"
          grep -q '"start_url": "/app.html"' <<<"$manifest"
          grep -q '"display": "standalone"' <<<"$manifest"
          grep -q 'triangulo-blue-192.png' <<<"$manifest"
          fetch "$base/icons/triangulo-blue-180.png?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/icons/triangulo-blue-192.png?verify=$GITHUB_SHA" >/dev/null
          fetch "$base/icons/triangulo-blue-512.png?verify=$GITHUB_SHA" >/dev/null
          grep -q "triangulo-pwa-" <<<"$sw"

          python - <<'PY'
          import json, urllib.request
          url = "https://trianguloacores.pt/manifest.json?verify=github-actions"
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)
          assert data["start_url"] == "/app.html"
          assert data["scope"] == "/"
          assert data["display"] == "standalone"
          assert any(i["sizes"] == "192x192" for i in data["icons"])
          assert any(i["sizes"] == "512x512" for i in data["icons"])
          print("Live manifest OK")
          PY

          echo "Live site OK: $base"
