name: Deploy TRIÂNGULO to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fetch real island photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 --retry-delay 2 "https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Ilha_do_Pico%2C_Montanha_ao_nascer_do_Sol%2C_A%C3%A7ores%2C_Portugal.JPG/1280px-Ilha_do_Pico%2C_Montanha_ao_nascer_do_Sol%2C_A%C3%A7ores%2C_Portugal.JPG" -o assets/pico-hero-real.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Zona_balnear_da_Madalena_do_Pico%2C_ilha_do_Pico%2C_A%C3%A7ores%2C_Portugal%2C_A%C3%A7ores.JPG/1280px-Zona_balnear_da_Madalena_do_Pico%2C_ilha_do_Pico%2C_A%C3%A7ores%2C_Portugal%2C_A%C3%A7ores.JPG" -o assets/pico-card-real.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Marina_da_Horta%2C_Concelho_da_Horta%2C_ilha_do_Faial%2C_A%C3%A7ores%2C_Portugal.JPG/1280px-Marina_da_Horta%2C_Concelho_da_Horta%2C_ilha_do_Faial%2C_A%C3%A7ores%2C_Portugal.JPG" -o assets/faial-real.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Faja_dos_bodes.jpg/1280px-Faja_dos_bodes.jpg" -o assets/sao-jorge-real.jpg
          test -s assets/pico-hero-real.jpg
          test -s assets/pico-card-real.jpg
          test -s assets/faial-real.jpg
          test -s assets/sao-jorge-real.jpg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
