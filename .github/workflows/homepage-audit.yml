name: Homepage functional audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/homepage-audit.yml"
      - "index.html"
      - "servicos/index.html"
      - "prestadores.html"
      - "candidatura-prestador.html"
      - "candidatura-rever.html"
      - "admin.html"
      - "how-it-works.html"
      - "sobre-nos.html"
      - "privacy.html"
      - "terms.html"
      - "instalar/index.html"
      - "sw.js"
      - "assets/home-master.webp"
      - "assets/home-master-2x.webp"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triangulo-homepage-audit
  cancel-in-progress: true

jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/triangulo-home-http.log 2>&1 &
          for i in {1..30}; do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/triangulo-home-http.log
          exit 1

      - name: Audit desktop and mobile interactions
        run: |
          mkdir -p homepage-audit
          cat > homepage-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const base='http://127.0.0.1:4173';
          const browser=await chromium.launch({headless:true});
          const report=[];

          async function open(viewport, lang='pt'){
            const context=await browser.newContext({viewport,locale:lang==='pt'?'pt-PT':'en-GB'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto(base+'/?lang='+lang+'&audit=1',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(250);
            return {context,page,errors};
          }

          function assertNoOverflow(page){
            return page.evaluate(()=>({
              vw:innerWidth,
              sw:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)
            })).then(({vw,sw})=>assert.ok(sw<=vw+2,'horizontal overflow '+sw+' > '+vw));
          }

          async function assertRoute(page, expectedPath, expectedParams={}){
            await page.waitForLoadState('domcontentloaded');
            const u=new URL(page.url());
            assert.equal(u.pathname,expectedPath);
            for(const [k,v] of Object.entries(expectedParams))assert.equal(u.searchParams.get(k),v,'param '+k);
          }

          // DESKTOP PT: approved master + real control layer.
          {
            const {context,page,errors}=await open({width:1857,height:1042},'pt');
            assert.equal(await page.locator('.master-desktop-ui').isVisible(),true,'desktop master overlay not visible');
            assert.equal(await page.locator('.stage .island-pills').isVisible(),true,'legacy island pills missing');
            assert.equal(await page.locator('.stage .searchbar').isVisible(),true,'legacy searchbar missing');
            assert.equal(await page.locator('.island-pills').getAttribute('inert'),'','legacy island controls must be inert under the PT desktop master');
            assert.equal(await page.locator('#homeSearch').getAttribute('inert'),'','legacy search must be inert under the PT desktop master');
            assert.equal(await page.locator('.category-row').getAttribute('inert'),'','legacy categories must be inert under the PT desktop master');
            assert.match(await page.locator('.hero').evaluate(el=>getComputedStyle(el,'::before').backgroundImage),/home-master/);
            await assertNoOverflow(page);

            await page.click('#masterTopSearch');
            assert.equal(await page.evaluate(()=>document.activeElement?.id),'masterSearchInput','top search did not focus master query');

            await page.selectOption('#masterIslandSelect','Faial');
            assert.equal(await page.locator('#masterIslandSelect').inputValue(),'Faial');
            assert.equal(await page.locator('#masterIslandValue').textContent(),'Faial','visible master island label did not update');
            assert.equal(await page.locator('#masterIslandValue').isVisible(),true,'selected non-default island label is not visible');
            assert.equal(await page.locator('#islandSelect').inputValue(),'Faial','master island selection did not sync legacy control');
            assert.equal(await page.evaluate(()=>localStorage.getItem('tri_island')),'Faial','master island selection did not persist');
            await page.fill('#masterSearchInput','jardim');
            await page.locator('#masterSearchInput').blur();
            assert.equal(await page.locator('#masterSearchInput').evaluate(el=>el.classList.contains('has-value')),true,'master query disappeared after blur');
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(60);
            assert.equal(await page.locator('#islandSelect').inputValue(),'Faial','selected island changed after switching to mobile layout');
            assert.equal(await page.locator('#searchInput').inputValue(),'jardim','search query was lost when switching to mobile layout');
            await page.fill('#searchInput','limpeza');
            await page.setViewportSize({width:1857,height:1042});
            await page.waitForTimeout(60);
            assert.equal(await page.locator('#masterIslandSelect').inputValue(),'Faial','master island state was lost after returning to desktop');
            assert.equal(await page.locator('#masterIslandValue').textContent(),'Faial','master island label was lost after returning to desktop');
            assert.equal(await page.locator('#masterSearchInput').inputValue(),'limpeza','mobile query was lost when returning to desktop');
            await Promise.all([
              page.waitForURL(/\/servicos\//,{waitUntil:'domcontentloaded',timeout:10000}),
              page.click('#masterSearchForm button[type="submit"]')
            ]);
            await assertRoute(page,'/servicos/',{island:'Faial',q:'limpeza'});
            assert.equal(errors.length,0,'desktop PT page errors: '+errors.join(' | '));
            await context.close();
          }

          // DESKTOP PT: regression for the real user viewport that exposed overlapping hotspots.
          {
            const {context,page,errors}=await open({width:1536,height:768},'pt');
            const boxes=await page.evaluate(()=>{
              const rect=s=>{const el=document.querySelector(s),r=el?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height}:null};
              return {
                pico:rect('.mh-pico'),faial:rect('.mh-faial'),saojorge:rect('.mh-saojorge'),
                query:rect('#masterSearchInput'),island:rect('#masterIslandSelect'),submit:rect('.mh-search-submit'),
                repairs:rect('.mh-cat-repairs'),garden:rect('.mh-cat-garden'),home:rect('.mh-cat-home'),personal:rect('.mh-cat-personal')
              };
            });
            const hitSelectors=[
              '.mh-brand','.mh-services','.mh-islands-nav','.mh-how','.mh-about','.mh-top-search','.mh-pt','.mh-en','.mh-login',
              '.mh-pico','.mh-faial','.mh-saojorge','#masterSearchInput','#masterIslandSelect','.mh-search-submit',
              '.mh-cat-repairs','.mh-cat-garden','.mh-cat-home','.mh-cat-personal'
            ];
            for(const selector of hitSelectors){
              const hit=await page.evaluate(sel=>{
                const el=document.querySelector(sel);if(!el)return false;
                const r=el.getBoundingClientRect();
                const top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return top===el||el.contains(top);
              },selector);
              assert.equal(hit,true,'master control is covered at its centre: '+selector);
            }
            const overlap=(a,b)=>Math.max(a.x,b.x)<Math.min(a.x+a.w,b.x+b.w)&&Math.max(a.y,b.y)<Math.min(a.y+a.h,b.y+b.h);
            for(const key of ['pico','faial','saojorge']){
              assert.equal(overlap(boxes[key],boxes.query),false,key+' island hotspot overlaps search input');
              assert.equal(overlap(boxes[key],boxes.island),false,key+' island hotspot overlaps search island selector');
              assert.equal(overlap(boxes[key],boxes.submit),false,key+' island hotspot overlaps search submit');
            }
            assert.ok(boxes.query.y>boxes.faial.y+boxes.faial.h,'search input must sit below island pills');
            assert.ok(boxes.repairs.y>boxes.submit.y+boxes.submit.h,'category cards must sit below search bar');
            await page.screenshot({path:'homepage-audit/desktop-user-viewport.png',fullPage:true});
            await page.evaluate(()=>{
              const selectors=[
                '.mh-brand','.mh-services','.mh-islands-nav','.mh-how','.mh-about','.mh-top-search','.mh-pt','.mh-en','.mh-login',
                '.mh-pico','.mh-faial','.mh-saojorge','#masterSearchInput','#masterIslandSelect','.mh-search-submit',
                '.mh-cat-repairs','.mh-cat-garden','.mh-cat-home','.mh-cat-personal'
              ];
              selectors.forEach((sel,i)=>{
                const el=document.querySelector(sel);if(!el)return;
                el.style.outline='2px solid '+(i%2?'#ff2d55':'#00e5ff');
                el.style.outlineOffset='-2px';
                if(el.tagName!=='INPUT'&&el.tagName!=='SELECT')el.style.background='rgba(255,45,85,.10)';
              });
            });
            await page.screenshot({path:'homepage-audit/desktop-user-viewport-hitboxes.png',fullPage:true});

            await Promise.all([
              page.waitForURL(/\/servicos\//,{waitUntil:'domcontentloaded',timeout:10000}),
              page.click('.mh-faial')
            ]);
            await assertRoute(page,'/servicos/',{island:'Faial'});
            assert.equal(errors.length,0,'real-viewport desktop PT errors: '+errors.join(' | '));
            await context.close();
          }

          // DESKTOP PT/EN: master language switch preserves in-progress search state.
          {
            const {context,page,errors}=await open({width:1536,height:768},'pt');
            await page.fill('#masterSearchInput','jardim');
            await page.click('.mh-en');
            assert.equal(await page.locator('html').getAttribute('lang'),'en','master EN switch did not update language');
            assert.equal(new URL(page.url()).searchParams.get('lang'),'en','master EN switch did not update URL');
            assert.equal(await page.locator('#searchInput').inputValue(),'jardim','master query was lost when switching to EN');
            assert.equal(await page.locator('.master-desktop-ui').isVisible(),false,'PT master stayed visible in EN');

            await page.click('#pt');
            assert.equal(await page.locator('html').getAttribute('lang'),'pt','switch back to PT failed');
            assert.equal(new URL(page.url()).searchParams.get('lang'),null,'PT switch left lang=en in URL');
            assert.equal(await page.locator('#masterSearchInput').inputValue(),'jardim','query was lost when switching back to PT');
            assert.equal(await page.locator('.master-desktop-ui').isVisible(),true,'PT master did not return');
            assert.equal(errors.length,0,'master language switch errors: '+errors.join(' | '));
            await context.close();
          }

          // DESKTOP PT: every master link has a real destination.
          {
            const {context,page}=await open({width:1857,height:1042},'pt');
            const hrefs=await page.locator('.master-desktop-ui a.master-hotspot').evaluateAll(as=>as.map(a=>({cls:a.className,href:a.getAttribute('href')})));
            for(const x of hrefs)assert.ok(x.href&&x.href!=='#','dead master link '+JSON.stringify(x));
            const expected=[
              '/', '/servicos/', '/how-it-works.html', '/sobre-nos.html',
              '/?lang=pt','/?lang=en','/prestadores.html',
              '/servicos/?island=Pico','/servicos/?island=Faial','/servicos/?island=S%C3%A3o+Jorge',
              '/servicos/?group=repairs','/servicos/?group=garden','/servicos/?group=home','/servicos/?group=personal'
            ];
            for(const href of expected)assert.ok(hrefs.some(x=>x.href===href),'missing master href '+href);
            await page.screenshot({path:'homepage-audit/desktop-pt.png',fullPage:true});
            await context.close();
          }

          // DESKTOP EN: underlying translated page remains complete.
          {
            const {context,page,errors}=await open({width:1857,height:1042},'en');
            assert.equal(await page.locator('.master-desktop-ui').isVisible(),false,'PT master should not cover EN');
            assert.equal(await page.locator('#homeSearch').isVisible(),true);
            assert.equal(await page.locator('#searchInput').getAttribute('placeholder'),'What service do you need?');
            assert.match(await page.locator('.nav a[href^="/sobre-nos"]').getAttribute('href'),/lang=en/);
            const englishLayout=await page.evaluate(()=>{
              const box=s=>{const r=document.querySelector(s).getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height}};
              return {headline:box('h1'),promise:box('.promise'),search:box('#homeSearch'),categories:box('.category-row'),trust:box('.trustbar')};
            });
            assert.ok(englishLayout.promise.top>englishLayout.headline.bottom+6,'English promise overlaps headline');
            assert.ok(englishLayout.categories.top>englishLayout.search.bottom+35,'English category row crowds search bar');
            assert.equal(await page.locator('.trust b').nth(2).evaluate(el=>el.getClientRects().length),1,'English trust heading wrapped');
            await page.screenshot({path:'homepage-audit/desktop-en.png',fullPage:true});
            await page.selectOption('#islandSelect','São Jorge');
            await page.fill('#searchInput','cleaning');
            await Promise.all([
              page.waitForURL(/\/servicos\//,{waitUntil:'domcontentloaded',timeout:10000}),
              page.click('#homeSearch button[type="submit"]')
            ]);
            await assertRoute(page,'/servicos/',{island:'São Jorge',q:'cleaning',lang:'en'});
            assert.equal(errors.length,0,'desktop EN page errors: '+errors.join(' | '));
            await context.close();
          }

          // MOBILE PT: real responsive page, navigation, search and categories.
          {
            const {context,page,errors}=await open({width:390,height:844},'pt');
            assert.equal(await page.locator('.master-desktop-ui').isVisible(),false);
            assert.equal(await page.locator('#homeSearch').isVisible(),true,'mobile search missing');
            assert.equal(await page.locator('.island-pills').getAttribute('inert'),null,'mobile island controls must remain interactive');
            assert.equal(await page.locator('#homeSearch').getAttribute('inert'),null,'mobile search must remain interactive');

            await page.click('.island-pill[data-island="Faial"]');
            await page.fill('#searchInput','limpeza');
            await Promise.all([
              page.waitForURL(/\/servicos\//,{waitUntil:'domcontentloaded',timeout:10000}),
              page.click('#homeSearch button[type="submit"]')
            ]);
            await assertRoute(page,'/servicos/',{island:'Faial',q:'limpeza'});
            assert.equal(errors.length,0,'mobile PT page errors: '+errors.join(' | '));
            await context.close();
          }

          // MOBILE PT category + MOBILE EN translation.
          {
            const {context,page}=await open({width:390,height:844},'pt');
            await page.click('.island-pill[data-island="São Jorge"]');
            await Promise.all([
              page.waitForURL(/\/servicos\//,{waitUntil:'domcontentloaded',timeout:10000}),
              page.click('.category[data-group="garden"]')
            ]);
            await assertRoute(page,'/servicos/',{island:'São Jorge',group:'garden'});
            await context.close();
          }
          {
            const {context,page,errors}=await open({width:390,height:844},'en');
            assert.equal(await page.locator('.master-desktop-ui').isVisible(),false);
            assert.equal(await page.locator('#homeSearch').isVisible(),true);
            assert.equal(await page.locator('#searchInput').getAttribute('placeholder'),'What service do you need?');
            assert.equal(await page.locator('#homeSearch').getAttribute('inert'),null);
            await assertNoOverflow(page);

            await page.click('#pt');
            assert.equal(new URL(page.url()).searchParams.get('lang'),null,'PT selection left lang=en in the URL');
            await page.reload({waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('html').getAttribute('lang'),'pt','PT choice did not survive reload');
            assert.equal(await page.locator('#searchInput').getAttribute('placeholder'),'Que serviço precisas?');

            await page.click('#en');
            assert.equal(new URL(page.url()).searchParams.get('lang'),'en','EN selection was not persisted in the URL');
            await page.reload({waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('html').getAttribute('lang'),'en','EN choice did not survive reload');
            assert.equal(await page.locator('#searchInput').getAttribute('placeholder'),'What service do you need?');

            assert.equal(errors.length,0,'mobile EN page errors: '+errors.join(' | '));
            await page.screenshot({path:'homepage-audit/mobile-en.png',fullPage:true});
            await context.close();
          }

          // Provider recruitment path: landing CTA, sign-in and multi-step application validation.
          {
            const context=await browser.newContext({viewport:{width:1280,height:900},locale:'pt-PT'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));

            await page.goto(base+'/prestadores.html',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('.cta').getAttribute('href'),'/candidatura-prestador.html?invite=site-prestadores');
            assert.equal(await page.locator('.login-link').getAttribute('href'),'/servicos/?prestador=1');

            await page.goto(base+'/candidatura-prestador.html?invite=site-prestadores',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('[data-form-step="1"]').isVisible(),true);
            await page.click('[data-step-next="2"]');
            assert.equal(await page.locator('[data-form-step="1"]').isVisible(),true,'empty step 1 should not advance');

            await page.fill('[name="name"]','Prestador Teste');
            await page.fill('[name="business_name"]','Empresa Teste');
            await page.fill('[name="phone"]','912345678');
            await page.click('[data-step-next="2"]');
            assert.equal(await page.locator('[data-form-step="2"]').isVisible(),true,'valid step 1 did not advance');

            await page.fill('[name="locality"]','Madalena');
            await page.check('[data-service-island][value="Pico"]');
            await page.check('[data-provider-cat][value="garden"]');
            await page.selectOption('#primaryCategory','garden');
            await page.fill('#description','Serviços da Empresa Teste em jardins.');
            await page.click('[data-step-next="3"]');
            assert.equal(await page.locator('[data-form-step="2"]').isVisible(),true,'business identity leak should keep provider on step 2');
            assert.match(await page.locator('#status').textContent(),/nome do negócio/i,'business identity validation message missing');
            await page.fill('#description','Liga para 912 345 678 para manutenção de jardins.');
            await page.click('[data-step-next="3"]');
            assert.equal(await page.locator('[data-form-step="2"]').isVisible(),true,'direct contact should keep provider on step 2');
            assert.match(await page.locator('#status').textContent(),/(telefone|contactos|links)/i,'direct contact validation message missing');
            await page.fill('#description','O Prestador Teste faz manutenção de jardins.');
            await page.click('[data-step-next="3"]');
            assert.equal(await page.locator('[data-form-step="2"]').isVisible(),true,'full provider identity should keep provider on step 2');
            assert.match(await page.locator('#status').textContent(),/nome completo/i,'full provider identity validation message missing');
            await page.fill('#description','Manutenção de jardins e terrenos.');
            await page.click('[data-step-next="3"]');
            assert.equal(await page.locator('[data-form-step="3"]').isVisible(),true,'valid step 2 did not advance');

            await page.selectOption('#pricingType','hour');
            await page.fill('#price','40');
            await page.fill('[name="availability"]','WhatsApp 912 345 678');
            await page.click('[data-step-next="4"]');
            assert.equal(await page.locator('[data-form-step="3"]').isVisible(),true,'direct contact in availability should keep provider on step 3');
            assert.match(await page.locator('#status').textContent(),/(telefone|contactos|links)/i,'availability contact validation message missing');
            await page.fill('[name="availability"]','Dias úteis a combinar');
            await page.click('[data-step-next="4"]');
            assert.equal(await page.locator('[data-form-step="4"]').isVisible(),true,'valid step 3 did not advance');

            await page.fill('[name="tax_id"]','123456789');
            assert.equal(await page.locator('[name="consent_all"]').isChecked(),false);
            assert.equal(errors.length,0,'provider application page errors: '+errors.join(' | '));
            await context.close();
          }

          // Provider sign-in entry, contact deep link and PWA shell.
          {
            const context=await browser.newContext({viewport:{width:390,height:844},locale:'pt-PT'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));

            await page.goto(base+'/servicos/?prestador=1',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(300);
            assert.equal(await page.locator('#providerAreaView').isVisible(),true,'provider area entry did not open');
            assert.equal(await page.locator('#paSignedOut').isVisible(),true,'provider signed-out card missing');
            assert.equal(await page.locator('#providerLoginEmail').isVisible(),true,'provider identifier field missing');
            assert.equal(await page.locator('#providerLoginPassword').isVisible(),true,'provider password field missing');

            await page.goto(base+'/servicos/?contact=1',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(250);
            assert.equal(await page.locator('#contactSheet').evaluate(el=>el.classList.contains('open')),true,'contact deep link did not open');

            await page.goto(base+'/instalar/',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('link[rel="manifest"]').getAttribute('href'),'/manifest.json');
            const manifest=await page.request.get(base+'/manifest.json');
            assert.equal(manifest.status(),200,'manifest unavailable');
            const sw=await page.request.get(base+'/sw.js');
            assert.equal(sw.status(),200,'service worker unavailable');
            assert.match(await sw.text(),/triangulo-pwa-20260924-v1-0-rc110/,'unexpected service-worker cache version');

            assert.equal(errors.length,0,'provider/contact/PWA page errors: '+errors.join(' | '));
            await context.close();
          }

          // Android install shell + standards-correct userChoice handling.
          {
            const context=await browser.newContext({
              viewport:{width:390,height:844},
              locale:'pt-PT',
              userAgent:'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.addInitScript(()=>sessionStorage.setItem('tri_sw_reload','1'));
            await page.goto(base+'/instalar/',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('#installBtn').isVisible(),true,'Android install button missing');
            assert.equal(await page.locator('#androidHeroBtn').isVisible(),true,'Android hero install button missing');
            const installHtml=await (await page.request.get(base+'/instalar/')).text();
            assert.match(installHtml,/await promptEvent\.prompt\(\)/,'Android PWA prompt call missing');
            assert.match(installHtml,/await promptEvent\.userChoice/,'Android PWA userChoice handling missing');
            assert.equal(errors.length,0,'Android install page errors: '+errors.join(' | '));
            await context.close();
          }

          // Client request and direct-booking forms: critical validation must happen before any backend call.
          {
            const context=await browser.newContext({viewport:{width:390,height:844},locale:'pt-PT'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));

            await page.goto(base+'/servicos/?island=Pico',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(700);

            await page.click('#publishNav');
            assert.equal(await page.locator('#requestSheet').evaluate(el=>el.classList.contains('open')),true,'general request sheet did not open');
            await page.fill('#requestForm [name="description"]','Cortar erva num terreno pequeno.');
            await page.fill('#requestForm [name="where"]','Madalena');
            await page.fill('#requestForm [name="client_phone"]','123');
            await page.click('#requestSubmitBtn');
            await page.waitForTimeout(50);
            assert.match(await page.locator('#requestSubmitStatus').textContent(),/WhatsApp válido/i,'general request invalid phone was not blocked in frontend');

            await page.evaluate(()=>{
              closeSheets();
              island='Faial';
              providersLoading=false;
              providersLoadError=false;
              realProviders=[];
              updateResults('');
            });
            assert.equal(await page.locator('#emptyPost').isVisible(),true,'empty-island help CTA missing');
            assert.equal(await page.locator('.empty-provider-cta').getAttribute('href'),'/prestadores.html','empty-island provider CTA incorrect');
            await page.click('#emptyPost');
            assert.equal(await page.locator('#requestSheet').evaluate(el=>el.classList.contains('open')),true,'empty-island help CTA did not open request form');

            // Results search must preserve an active category filter when editing/clearing text.
            await page.evaluate(()=>{
              closeSheets();
              activeSearchQuery='aulas';
              activeServiceGroup='garden';
              $('#resultsInput').value='aulas';
            });
            await page.press('#resultsInput','Enter');
            await page.waitForTimeout(30);
            assert.equal(await page.evaluate(()=>activeServiceGroup),'garden','results Enter cleared the active category filter');
            assert.equal(new URL(page.url()).searchParams.get('group'),'garden','results URL lost category filter after Enter');
            await page.click('#clearResultsSearch');
            await page.waitForTimeout(30);
            assert.equal(await page.evaluate(()=>activeServiceGroup),'garden','clear search cleared the active category filter');
            assert.equal(await page.evaluate(()=>activeSearchQuery),'','clear search did not clear only the query');

            // Broad results groups must not be misclassified as one narrow request category.
            await page.evaluate(()=>{
              closeSheets();
              activeSearchQuery='Preciso de ajuda';
              activeServiceGroup='repairs';
              $('#requestForm [name="category_code"]').value='garden';
              openRequest(activeSearchQuery);
            });
            assert.equal(await page.locator('#requestForm [name="category_code"]').inputValue(),'','broad repairs/tech/moving group forced a narrow request category');
            assert.equal(await page.locator('#requestForm [name="description"]').inputValue(),'Preciso de ajuda','fallback request lost active search text');

            await page.evaluate(()=>{
              closeSheets();
              island='Pico';
              providersLoading=false;
              providersLoadError=false;
              activeResultsSort='price';
              realProviders=[
                {
                  id:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                  service_id:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                  provider_id:'33333333-3333-4333-8333-333333333333',
                  title:'Serviço caro',
                  description:'Opção cara',
                  category_code:'repairs',
                  pricing_type:'fixed',
                  price:100,
                  availability:'Seg–Sex',
                  name:'Mesmo Prestador',
                  locality:'Madalena',
                  service_islands:['Pico'],
                  photo_data:null,
                  completed_jobs:0,response_rate:0,review_average:null,review_count:0,review_excerpt:'',rank_score:20
                },
                {
                  id:'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
                  service_id:'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
                  provider_id:'33333333-3333-4333-8333-333333333333',
                  title:'Serviço barato',
                  description:'Opção barata',
                  category_code:'repairs',
                  pricing_type:'fixed',
                  price:25,
                  availability:'Seg–Sex',
                  name:'Mesmo Prestador',
                  locality:'Madalena',
                  service_islands:['Pico'],
                  photo_data:null,
                  completed_jobs:0,response_rate:0,review_average:null,review_count:0,review_excerpt:'',rank_score:10
                }
              ];
              updateResults('');
            });
            assert.match(await page.locator('#resultsList').textContent(),/Serviço barato/,'price sort did not select provider cheapest matching service');
            assert.doesNotMatch(await page.locator('#resultsList').textContent(),/Serviço caro/,'price sort kept a more expensive service for the same provider');

            await page.evaluate(()=>{
              activeResultsSort='relevance';
              closeSheets();
              island='Pico';
              providersLoading=false;
              providersLoadError=false;
              realProviders=[{
                id:'11111111-1111-4111-8111-111111111111',
                service_id:'11111111-1111-4111-8111-111111111111',
                provider_id:'22222222-2222-4222-8222-222222222222',
                title:'Jardim & Terrenos',
                description:'Limpeza de terrenos',
                category_code:'garden',
                pricing_type:'quote',
                price:null,
                availability:'Seg–Sex',
                name:'Prestador',
                locality:'Madalena',
                service_islands:['Pico'],
                photo_data:null,
                completed_jobs:0,
                response_rate:0,
                review_average:null,
                review_count:0,
                review_excerpt:'',
                rank_score:1
              }];
              updateResults('');
              openBooking('11111111-1111-4111-8111-111111111111');
            });
            assert.equal(await page.locator('#bookSheet').evaluate(el=>el.classList.contains('open')),true,'direct booking sheet did not open');
            const quickDates=page.locator('[data-date]');
            assert.ok(await quickDates.count()>=2,'booking quick dates missing');
            await quickDates.nth(1).click();
            assert.equal(await quickDates.nth(1).evaluate(el=>el.classList.contains('active')),true,'booking quick date did not activate');
            await page.fill('#bookNote','Limpeza de um terreno com erva alta.');
            await page.fill('#bookLocation','Madalena');
            await page.fill('#bookPhone','123');
            await page.click('#confirmBook');
            await page.waitForTimeout(50);
            assert.match(await page.locator('#toast').textContent(),/WhatsApp válido/i,'direct booking invalid phone was not blocked in frontend');

            assert.equal(errors.length,0,'client request page errors: '+errors.join(' | '));
            await context.close();
          }

          // Legacy aliases must land on current routes without losing useful parameters.
          {
            const context=await browser.newContext();
            const page=await context.newPage();

            await page.goto(base+'/app.html?lang=en&q=garden',{waitUntil:'domcontentloaded'});
            await page.waitForURL(/\/servicos\/\?lang=en&q=garden/);
            assert.equal(new URL(page.url()).pathname,'/servicos/');

            await page.goto(base+'/inicio.html?lang=en',{waitUntil:'domcontentloaded'});
            await page.waitForURL(u=>new URL(u).pathname==='/'&&new URL(u).searchParams.get('lang')==='en');

            const fake='00000000-0000-0000-0000-000000000000';
            const tokenNav=page.waitForRequest(req=>{
              const u=new URL(req.url());
              return u.pathname==='/servicos/'&&u.searchParams.get('booking_token')===fake&&u.searchParams.get('lang')==='en';
            });
            await page.goto(base+'/reserva-responder.html?token='+fake+'&lang=en',{waitUntil:'domcontentloaded'});
            await tokenNav;
            await page.waitForURL(u=>new URL(u).pathname==='/servicos/');
            assert.equal(new URL(page.url()).searchParams.has('booking_token'),false,'private booking token remained visible in the address bar');

            await context.close();
          }

          // Private provider/client tokens must be removed from the address bar after processing.
          {
            const context=await browser.newContext();
            const page=await context.newPage();
            const fake='00000000-0000-0000-0000-000000000000';
            const cases=[
              ['client_token',fake],
              ['request_token',fake],
              ['match_token',fake],
              ['booking_token',fake],
              ['provider_password_token','deadbeef']
            ];
            for(const [key,value] of cases){
              await page.goto(base+'/servicos/?'+key+'='+encodeURIComponent(value),{waitUntil:'domcontentloaded'});
              await page.waitForFunction(k=>!new URL(location.href).searchParams.has(k),key,{timeout:5000});
              assert.equal(new URL(page.url()).searchParams.has(key),false,key+' remained visible in the address bar');
            }
            await context.close();
          }

          // Admin/review entry shells must remain operational without exposing data when signed out.
          {
            const context=await browser.newContext({viewport:{width:1280,height:800},locale:'pt-PT'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));

            await page.goto(base+'/admin.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(200);
            assert.equal(await page.locator('#login').isVisible(),true,'admin login shell missing');
            assert.equal(await page.locator('#panel').isVisible(),false,'admin panel visible while signed out');
            assert.equal(await page.evaluate(()=>waPhone('912 345 678')),'351912345678','Portuguese WhatsApp number was not normalized');
            assert.equal(await page.evaluate(()=>waPhone('296 123 456')),'351296123456','Portuguese 9-digit fixed number was not normalized');
            assert.equal(await page.evaluate(()=>waPhone('0049123456789')),'49123456789','international 00 WhatsApp number was not normalized');

            await page.goto(base+'/candidatura-rever.html?token=00000000-0000-0000-0000-000000000000',{waitUntil:'domcontentloaded'});
            assert.equal(await page.evaluate(()=>waPhone('912 345 678')),'351912345678','provider-review WhatsApp number was not normalized');
            await page.waitForTimeout(200);
            assert.equal(await page.locator('#loginbox').evaluate(el=>el.classList.contains('show')),true,'provider review admin login missing');

            assert.equal(errors.length,0,'admin/review page errors: '+errors.join(' | '));
            await context.close();
          }

          // Static route existence + internal public-link crawl.
          {
            const context=await browser.newContext();
            const page=await context.newPage();
            const publicRoutes=['/','/servicos/','/how-it-works.html','/sobre-nos.html','/prestadores.html','/candidatura-prestador.html','/instalar/','/privacy.html','/terms.html'];
            for(const path of publicRoutes){
              const res=await page.request.get(base+path);
              assert.equal(res.status(),200,'route '+path+' returned '+res.status());
            }

            const checked=new Set();
            for(const route of publicRoutes){
              await page.goto(base+route,{waitUntil:'domcontentloaded'});
              const hrefs=await page.locator('a[href]').evaluateAll(as=>as.map(a=>a.getAttribute('href')).filter(Boolean));
              for(const href of hrefs){
                if(href.startsWith('#')||href.startsWith('mailto:')||href.startsWith('tel:')||href.startsWith('javascript:'))continue;
                const u=new URL(href,base+route);
                if(u.origin!==new URL(base).origin)continue;
                const key=u.pathname+u.search;
                if(checked.has(key))continue;
                checked.add(key);
                const res=await page.request.get(u.toString());
                assert.ok(res.status()>=200&&res.status()<400,'internal link '+key+' returned '+res.status()+' from '+route);
              }
            }
            report.push({internalLinksChecked:checked.size});
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('homepage-audit/report.json',JSON.stringify({ok:true,checkedAt:new Date().toISOString(),report},null,2));
          console.log('Homepage audit passed');
          JS
          node homepage-audit.mjs

      - name: Upload homepage audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triangulo-homepage-audit
          path: homepage-audit/
          retention-days: 7
