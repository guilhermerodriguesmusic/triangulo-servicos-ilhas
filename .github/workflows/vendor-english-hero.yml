name: Vendor English homepage hero

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vendor-english-hero.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download clean Pico hero
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Rock%20walled%20plots%20of%20S%C3%A3o%20Mateus%20where%20grapes%20are%20grown%20with%20Mt.%20Pico%20in%20the%20background.jpg?width=1920"             -o assets/pico-hero-clean.jpg
          test -s assets/pico-hero-clean.jpg
          file assets/pico-hero-clean.jpg
      - name: Commit local hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pico-hero-clean.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Vendor clean Pico hero locally"
          git push
