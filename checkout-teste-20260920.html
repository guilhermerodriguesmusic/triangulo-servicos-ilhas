<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TRIÂNGULO — Teste de pagamento</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eaf8ff;color:#12355b;min-height:100vh;display:grid;place-items:center}
.card{width:min(92vw,440px);background:white;border-radius:22px;padding:26px;box-shadow:0 14px 45px rgba(18,53,91,.14)}
h1{margin:0 0 6px;font-size:26px}.sub{margin:0 0 22px;color:#547089}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #e8eef3}.total{font-size:22px;font-weight:700;border:0;padding-top:16px}
button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:18px;background:#0b7eaa;color:white;font-weight:700;font-size:17px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.msg{margin-top:14px;font-size:14px;line-height:1.4}.ok{color:#137a4b}.err{color:#a23a3a}
.badge{display:inline-block;background:#e7f7ef;color:#137a4b;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px;margin-bottom:14px}
</style>
</head>
<body>
<div class="card">
  <div class="badge">MODO DE TESTE</div>
  <h1>Pagamento TRIÂNGULO</h1>
  <p class="sub">Reserva fictícia para validar o checkout.</p>
  <div id="content">A carregar reserva…</div>
  <button id="pay" hidden>Pagar 46 €</button>
  <div id="msg" class="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
 const SUPABASE_URL='https://cozamrvrhmwgxbuubjub.supabase.co';
 const SUPABASE_KEY='sb_publishable_4WXv0AQJ_HceVNnFKcZFHA_TuZPTHd9';
 const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
 const qs=new URLSearchParams(location.search);
 const token=qs.get('client_token');
 const content=document.getElementById('content'),pay=document.getElementById('pay'),msg=document.getElementById('msg');
 if(!token){content.textContent='Token de teste em falta.';return}
 try{
  const {data,error}=await db.rpc('booking_client_context',{p_token:token});
  if(error||!data||!data.ok) throw new Error(error?.message||'Reserva não encontrada');
  content.innerHTML=
   '<div class="row"><span>Prestador recebe</span><b>€'+Number(data.provider_amount||0).toFixed(2)+'</b></div>'+
   '<div class="row"><span>Taxa TRIÂNGULO</span><b>€'+Number(data.service_fee_amount||0).toFixed(2)+'</b></div>'+
   '<div class="row total"><span>Total</span><span>€'+Number(data.total_amount||0).toFixed(2)+'</span></div>';
  if(!data.checkout_available){
    msg.className='msg err';
    msg.textContent='Checkout ainda não disponível para esta reserva.';
    return;
  }
  pay.hidden=false;
  pay.textContent='Pagar €'+Number(data.total_amount||0).toFixed(2);
  pay.onclick=async()=>{
   pay.disabled=true;msg.className='msg';msg.textContent='A abrir Stripe Checkout…';
   try{
    const {data:co,error:coErr}=await db.functions.invoke('stripe-create-checkout',{body:{client_token:token}});
    if(coErr||!co?.ok||!co?.url) throw new Error(co?.error||coErr?.message||'Falha ao criar checkout');
    location.href=co.url;
   }catch(e){
    console.error(e);pay.disabled=false;msg.className='msg err';msg.textContent='Erro: '+(e?.message||String(e));
   }
  };
 }catch(e){
  console.error(e);content.textContent='Não foi possível carregar a reserva.';msg.className='msg err';msg.textContent=e?.message||String(e);
 }
})();
</script>
</body>
</html>
