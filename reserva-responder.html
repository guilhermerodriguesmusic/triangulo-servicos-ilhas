<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#123a68">
<title>Responder ao pedido — TRIÂNGULO</title>
<link rel="canonical" href="https://trianguloacores.pt/servicos/">
<link rel="icon" href="/logo.svg">
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const token=qs.get('token')||qs.get('booking_token');
  const lang=(qs.get('lang')==='en'||localStorage.getItem('tri_lang')==='en')?'en':'pt';
  const p=new URLSearchParams();if(token)p.set('booking_token',token);if(lang==='en')p.set('lang','en');
  const target='/servicos/'+(p.toString()?'?'+p.toString():'');
  location.replace(target);
})();
</script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f9fc;color:#153458;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:460px;width:100%;background:#fff;border:1px solid #dce9ef;border-radius:22px;padding:28px;text-align:center;box-shadow:0 14px 38px rgba(21,52,88,.07)}img{width:190px;max-width:80%;height:auto}.card p{color:#657e91;line-height:1.5}.card a{display:inline-block;margin-top:8px;background:#108b6e;color:#fff;text-decoration:none;font-weight:900;padding:12px 16px;border-radius:12px}
</style>
</head>
<body>
<div class="card">
<img src="/logo-v2.svg" alt="TRIÂNGULO Açores">
<p id="opening">A abrir o teu pedido no TRIÂNGULO…</p>
<a id="fallback" href="/servicos/">Continuar</a>
</div>
<script>
const q=new URLSearchParams(location.search),t=q.get('token')||q.get('booking_token'),lang=(q.get('lang')==='en'||localStorage.getItem('tri_lang')==='en')?'en':'pt';
document.documentElement.lang=lang;document.title=lang==='en'?'Open request — TRIÂNGULO':'Responder ao pedido — TRIÂNGULO';
document.getElementById('opening').textContent=lang==='en'?'Opening your TRIÂNGULO request…':'A abrir o teu pedido no TRIÂNGULO…';
document.getElementById('fallback').textContent=lang==='en'?'Continue':'Continuar';
const p=new URLSearchParams();if(t)p.set('booking_token',t);if(lang==='en')p.set('lang','en');document.getElementById('fallback').href='/servicos/'+(p.toString()?'?'+p.toString():'');
</script>
</body>
</html>
